            else document.getElementById('modal-save').click();
        }));
        document.getElementById('save-all').addEventListener('click', () => {
            const base = `color-spectrums_sat-${state.sat.toFixed(2)}_tint-${state.tint.toFixed(2)}_shade-${state.shade.toFixed(2)}_tone-${state.tone.toFixed(2)}`;
            saveSpaceCollection(activeSpaces, state.exportFormat, base, true, true);
        });
        document.addEventListener('click', event => {
            document.querySelectorAll('.split-menu').forEach(menu => {
                if (!menu.parentElement.contains(event.target)) {
                    menu.classList.add('hidden');
                    const toggle = menu.previousElementSibling;
                    if (toggle) toggle.setAttribute('aria-expanded', 'false');
                }
            });
        });

        function renderSpacesPopover() {
            const groups = ['All', 'Default', 'SDR', 'HDR', 'CIE', 'Perceptual'];
            const groupHost = document.getElementById('space-groups');
            groupHost.innerHTML = groups.map(group => `<button class="space-group bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded text-xs" data-group="${group}">${group}</button>`).join('');
            groupHost.querySelectorAll('.space-group').forEach(button => button.addEventListener('click', () => {
                const group = button.dataset.group;
                const currentlyEnabled = new Set(enabledSpaceIds());
                const groupIds = group === 'All'
                    ? initialSpaces.map(space => space.id)
                    : initialSpaces.filter(space => space.groups.includes(group)).map(space => space.id);
                // sRGB remains as a reference when changing groups while it
                // is already selected. Once explicitly removed, unrelated
                // groups do not silently add it back.
                if (currentlyEnabled.has('sRGB') && !groupIds.includes('sRGB')) groupIds.push('sRGB');
                state.enabledIds = groupIds;
                rebuildActiveSpaces();
                renderSpacesPopover();
                renderSpectrums();
                persistState();
            }));
            const enabled = new Set(enabledSpaceIds());
            document.getElementById('space-checkboxes').innerHTML = fullSpaceOrder.map(space => `<label class="flex items-center gap-2 text-sm text-gray-200"><input type="checkbox" class="space-checkbox accent-blue-500" data-space-id="${space.id}" ${enabled.has(space.id) ? 'checked' : ''}><span>${space.name}</span><span class="text-xs text-gray-500 ml-auto">${space.groups.join(' · ')}</span></label>`).join('');
            document.querySelectorAll('.space-checkbox').forEach(input => input.addEventListener('change', () => {
                const selected = new Set(enabledSpaceIds());
                if (input.checked) selected.add(input.dataset.spaceId); else selected.delete(input.dataset.spaceId);
                state.enabledIds = [...selected];
                rebuildActiveSpaces();
                renderSpacesPopover();
                renderSpectrums();
                persistState();
            }));
        }

        document.getElementById('btn-spaces').addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            document.getElementById('spaces-popover').classList.toggle('hidden');
        });
        document.addEventListener('click', event => {
            if (!event.target.closest('#btn-spaces') && !event.target.closest('#spaces-popover')) document.getElementById('spaces-popover').classList.add('hidden');
        });
        document.getElementById('top-controls').addEventListener('toggle', event => {
            state.controlsOpen = event.target.open;
            document.getElementById('top-control-panel').classList.toggle('p-4', event.target.open);
            document.getElementById('top-control-panel').classList.toggle('p-1', !event.target.open);
            requestAnimationFrame(() => {
                fitRowHeights();
                renderSelectorOverlays(state.lastHover);
                refreshPinnedPointTooltip();
            });
            persistState();
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) hideModal();
        });

        // Initialize App
        restoreState();
        rebuildActiveSpaces();
        controls.forEach(id => {
            const input = document.getElementById(`ctrl-${id}`);
            const value = state[id];
            input.value = value;
            document.getElementById(`val-${id}`).textContent = id === 'zoom' ? Number(value).toFixed(1) + 'x' : Number(value).toFixed(2);
        });
        document.getElementById('ctrl-order').value = state.order;
        document.getElementById('ctrl-inverse').classList.toggle('bg-blue-600', state.inverse);
        document.getElementById('ctrl-inverse').classList.toggle('bg-gray-700', !state.inverse);
        document.getElementById('top-controls').open = state.controlsOpen;
        document.getElementById('top-control-panel').classList.toggle('p-4', state.controlsOpen);
        document.getElementById('top-control-panel').classList.toggle('p-1', !state.controlsOpen);
        updateSaveButtons();
        setButtonGroup('.format-button', state.format);
        setButtonGroup('.selector-button', state.selector);
        renderSpacesPopover();
        renderSpectrums();
        if (state.selectionPinned && state.lastHover && activeSpaces[state.lastHover.rowIndex]) {
            const target = getSelectionFor(activeSpaces[state.lastHover.rowIndex], state.lastHover.t, null);
            updateSelectedValues(activeSpaces.map((space, index) => ({
                space,
                rgb: getSelectionFor(space, state.lastHover.t, state.selector === 'closest' ? target.rgb : null).rgb,
                rowIndex: index
            })));
            renderSelectorOverlays(state.lastHover);
        }

    </script>
</body>
</html>
