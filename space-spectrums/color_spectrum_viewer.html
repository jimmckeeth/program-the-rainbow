<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Spectrum Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/colorjs.io/dist/color.global.js"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        /* Hide scrollbar for the main view but keep functionality */
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .drag-over {
            border-top: 4px solid #3b82f6;
            opacity: 0.8;
        }
        .color-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            transform: translate(15px, 15px);
            border: 1px solid #4b5563;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        #top-controls > summary::marker {
            color: white;
            font-size: 1rem;
        }
        #top-controls > summary {
            display: list-item;
        }
        #top-controls > summary h1 {
            display: inline;
        }
        .split-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 0.25rem);
            min-width: 9rem;
            z-index: 60;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 0.25rem;
            padding: 0.25rem;
            box-shadow: 0 10px 20px rgba(0,0,0,.35);
        }
        .split-menu button {
            display: block;
            width: 100%;
            text-align: left;
            color: white;
            padding: 0.35rem 0.5rem;
            border-radius: 0.2rem;
        }
        .split-menu button:hover,
        .split-menu button.active {
            background: #2563eb;
        }
        #save-menu {
            top: auto;
            bottom: calc(100% + 0.25rem);
        }
        .grabbing {
            cursor: grabbing !important;
        }
        .selector-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 8px;
            transform: translateX(-50%);
            border-left: 2px solid rgba(255,255,255,0.95);
            border-right: 2px solid rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }
        .selector-tooltip {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            pointer-events: none;
            padding: 2px 5px;
            border-radius: 3px;
            font: 11px monospace;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.65);
            box-shadow: 0 1px 3px rgba(0,0,0,.5);
        }
        .selector-path {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }
        .point-crosshair {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 0;
            border-left: 2px solid rgba(255,255,255,0.95);
            border-right: 2px solid rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }
        .point-crosshair::after {
            content: '';
            position: absolute;
            left: -6px;
            top: 50%;
            width: 12px;
            border-top: 2px solid rgba(255,255,255,0.95);
            border-bottom: 2px solid rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Control Panel -->
    <div id="top-control-panel" class="bg-gray-800 border-b border-gray-700 p-4 shrink-0 shadow-lg z-20">
        <div class="max-w-7xl mx-auto">
            <details id="top-controls" open class="relative">
                    <summary class="cursor-pointer text-sm select-none" aria-label="Toggle controls">
                        <h1 class="text-xl font-bold text-blue-400">Color Spectrum Viewer</h1>
                    </summary>
                    <div id="top-controls-panel">
                        <div class="flex justify-end items-center gap-2 mb-3">
                            <div class="relative">
                                <button id="btn-spaces" type="button" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded shadow text-sm transition-colors">Spaces</button>
                                <div id="spaces-popover" class="hidden absolute right-0 top-full mt-2 w-80 bg-gray-800 border border-gray-600 rounded shadow-2xl p-3 z-50">
                                    <div class="flex flex-wrap gap-1 mb-3" id="space-groups"></div>
                                    <div id="space-checkboxes" class="grid grid-cols-1 gap-1 max-h-72 overflow-y-auto"></div>
                                </div>
                            </div>
                            <div class="relative flex">
                                <button id="btn-reset-sliders" type="button" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-l shadow text-sm transition-colors">Reset</button>
                                <button id="reset-menu-button" type="button" class="bg-blue-700 hover:bg-blue-600 text-white px-2 py-1 rounded-r shadow text-sm" aria-label="Reset menu" aria-expanded="false">▼</button>
                                <div id="reset-menu" class="split-menu hidden">
                                    <button type="button" data-reset="all">Reset all</button>
                                </div>
                            </div>
                        </div>
                        <!-- Controls Grid -->
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 text-sm">

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Saturation</span>
                        <span id="val-sat" class="text-blue-300 font-mono">1.0</span>
                    </label>
                    <input type="range" id="ctrl-sat" min="0" max="2" step="0.05" value="1" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Tint</span>
                        <span id="val-tint" class="text-blue-300 font-mono">0.0</span>
                    </label>
                    <input type="range" id="ctrl-tint" min="0" max="1" step="0.01" value="0" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Shade</span>
                        <span id="val-shade" class="text-blue-300 font-mono">0.0</span>
                    </label>
                    <input type="range" id="ctrl-shade" min="0" max="1" step="0.01" value="0" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Tone</span>
                        <span id="val-tone" class="text-blue-300 font-mono">0.0</span>
                    </label>
                    <input type="range" id="ctrl-tone" min="0" max="1" step="0.01" value="0" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1 items-center">
                        <span class="text-gray-300">Zoom</span>
                        <div class="flex space-x-2 items-center">
                            <button id="btn-reset-zoom" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-0.5 rounded text-gray-200">Reset</button>
                            <span id="val-zoom" class="text-blue-300 font-mono">1.0x</span>
                        </div>
                    </label>
                    <input type="range" id="ctrl-zoom" min="1" max="10" step="0.1" value="1" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col justify-end">
                    <label class="mb-1 text-gray-300">Order</label>
                    <div class="flex space-x-2">
                        <select id="ctrl-order" class="bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 focus:outline-none focus:border-blue-500 cursor-pointer flex-1">
                            <option value="default">Default</option>
                            <option value="alpha">Alphabetical</option>
                            <option value="date">Date</option>
                            <option value="custom">Custom</option>
                        </select>
                        <button id="ctrl-inverse" class="bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 hover:bg-gray-600 focus:outline-none transition-colors" title="Toggle Inverse">
                            ↓↑
                        </button>
                    </div>
                </div>
            </div>
            </div>
            </details>
        </div>
    </div>

    <!-- Main Spectrum Container -->
    <div class="flex-1 min-h-0 overflow-y-auto overflow-x-auto relative bg-gray-950">
        <div id="spectrum-wrapper" class="flex flex-col min-w-full transition-none">
            <!-- Spectrums will be injected here via JS -->
        </div>
    </div>

    <!-- Bottom Selection and Format Controls -->
    <div class="bg-gray-800 border-t border-gray-700 p-3 shrink-0 z-20">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-2 text-sm">
            <div class="flex items-center gap-1" role="group" aria-label="Color format">
                <span class="text-gray-400 mr-1">Format</span>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="hex">HEX</button>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="hashHex">#HEX</button>
                <button class="format-button bg-blue-600 text-white px-2 py-1 rounded" data-format="rgb">RGB</button>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="hsl">HSL</button>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="cmyk">CMYK</button>
            </div>
            <div class="flex items-center gap-1" role="group" aria-label="Selection mode">
                <span class="text-gray-400 ml-2 mr-1">Select</span>
                <button class="selector-button bg-blue-600 text-white px-2 py-1 rounded" data-selector="point">Point</button>
                <button class="selector-button bg-gray-700 text-white px-2 py-1 rounded" data-selector="vertical">Vertical</button>
                <button class="selector-button bg-gray-700 text-white px-2 py-1 rounded" data-selector="closest">Closest</button>
            </div>
            <textarea id="selected-color" rows="1" readonly placeholder="Click a spectrum to select a color"
                   class="flex-1 min-w-[220px] max-h-20 bg-gray-900 border border-gray-600 rounded px-3 py-1 text-white font-mono focus:outline-none resize-y"></textarea>
            <button id="copy-color" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded">Copy</button>
            <div id="save-control" class="relative flex">
                <button id="save-all" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded-l">Save SVG</button>
                <button id="save-menu-button" class="bg-green-700 hover:bg-green-600 text-white px-2 py-1 rounded-r" aria-label="Save format menu" aria-expanded="false">▼</button>
                <div id="save-menu" class="split-menu hidden">
                    <div class="px-2 py-1 text-xs text-gray-400">Save format</div>
                    <button type="button" data-save-format="svg">SVG</button>
                    <button type="button" data-save-format="png">PNG</button>
                    <button type="button" data-save-format="webp">WebP</button>
                    <button type="button" data-save-format="json">JSON</button>
                </div>
            </div>
            <span id="selection-status" class="text-xs text-gray-400" aria-live="polite"></span>
        </div>
    </div>

    <!-- Info Modal -->
    <div id="color-tooltip" class="color-tooltip hidden">#000000</div>
    <div id="info-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 max-w-lg w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-200" id="modal-content-box">
            <h2 id="modal-title" class="text-2xl font-bold text-blue-400 mb-2">Color Space Name</h2>
            <div id="modal-body" class="text-gray-300 space-y-4 mb-6 leading-relaxed">
                <!-- Content injected here -->
            </div>
            <div class="flex flex-wrap justify-end items-center gap-2">
                <div id="modal-save-control" class="relative flex">
                    <button id="modal-save" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-l shadow transition-colors">Save SVG</button>
                    <button id="modal-save-menu-button" class="bg-green-700 hover:bg-green-600 text-white px-2 py-2 rounded-r shadow transition-colors" aria-label="Save format menu" aria-expanded="false">▼</button>
                    <div id="modal-save-menu" class="split-menu hidden bottom-full top-auto mb-1">
                        <div class="px-2 py-1 text-xs text-gray-400">Save format</div>
                        <button type="button" data-save-format="svg">SVG</button>
                        <button type="button" data-save-format="png">PNG</button>
                        <button type="button" data-save-format="webp">WebP</button>
                        <button type="button" data-save-format="json">JSON</button>
                    </div>
                </div>
                <button id="modal-close" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            sat: 1.0,
            tint: 0.0,
            shade: 0.0,
            tone: 0.0,
            zoom: 1.0,
            order: 'default',
            inverse: false,
            draggedItemIndex: null,
            format: 'rgb',
            selector: 'point',
            selectedRgb: null,
            selectedValues: [],
            selectionPinned: false,
            lastHover: null,
            enabledIds: null,
            exportFormat: 'svg',
            controlsOpen: true
        };

        const STORAGE_KEY = 'color-spectrum-viewer-state-v4';
        let suppressPersistence = false;

        const NUM_STOPS = 360;
        const COMPACT_ROW_HEIGHT = 64;

        // Information text for each space
        const spaceInfo = {
            sRGB: "<b>sRGB (Standard RGB) (1996)</b><br>The standard color space for the web. Interpolating hue fully saturates the primary and secondary vertices of the RGB cube. Visually identical to basic HSL/HSV sweeps at max saturation.",
            XYZ: "<b>CIE 1931 XYZ (1931)</b><br>The foundational color space mapping human vision. Displayed here as a balanced chromaticity-plane sweep converted through a full color-management pipeline.",
            UVW: "<b>CIE 1964 UVW (1964)</b><br>An early attempt at a perceptually uniform color space. Sweeping the chromaticity plane creates a different distribution of hues compared to standard RGB.",
            CIELAB: "<b>CIE LAB (1976)</b><br>A perceptually uniform space designed to approximate human vision. Displayed here via its cylindrical LCH coordinate system.",
            CIELUV: "<b>CIE LUV (1976)</b><br>Another perceptually uniform space from 1976, heavily used for displays. Swept via its cylindrical LCHuv coordinates.",
            HSLuv: "<b>HSLuv (2015)</b><br>A human-friendly alternative to HSL, based on the CIELUV color space. It maintains perceptual uniformity, preventing the harsh luminance shifts seen in standard HSL.",
            OKLCH: "<b>Oklch (Perceptual) (2020)</b><br>A modern perceptually uniform color space. Sweeps through Hue angles while maintaining a constant Lightness and Chroma, preserving perceived brightness flawlessly.",
            LCH: "<b>CIE L*C*h° (1976)</b><br>A cylindrical representation of the CIELAB color space. Sweeping Hue maintains perceived lightness and chroma, though it exhibits slight blue-to-purple hue shifts compared to Oklch.",
            ICTCP: "<b>ICtCp (HDR)</b><br>An HDR color space from Rec. 2100 using perceptual quantization and designed for high dynamic range image and video signals.",
            Jzazbz: "<b>Jzazbz (HDR)</b><br>A perceptually oriented HDR color space designed to improve uniformity for very bright colors.",
            CAM16UCS: "<b>CAM16-UCS</b><br>A uniform color space derived from the CIECAM16 appearance model under defined viewing conditions."
        };

        
        // 1. sRGB Sweep: Red -> Yellow -> Green -> Cyan -> Blue -> Magenta -> Red
        function getSrgb(t) {
            let h = t * 6; // 0 to 6
            let r=0, g=0, b=0;
            if (h < 1) { r = 1; g = h; b = 0; }
            else if (h < 2) { r = 2-h; g = 1; b = 0; }
            else if (h < 3) { r = 0; g = 1; b = h-2; }
            else if (h < 4) { r = 0; g = 4-h; b = 1; }
            else if (h < 5) { r = h-4; g = 0; b = 1; }
            else { r = 1; g = 0; b = 6-h; }
            return [r, g, b];
        }

        // CIELUV Hue Sweep
        function lchUvToRgb(t) {
            let h = t * 360; let l = 70; let c = 60;
            let hr = h * Math.PI / 180;
            let u = c * Math.cos(hr); let v = c * Math.sin(hr);
            let y = l > 8 ? Math.pow((l + 16) / 116, 3) : l / 903.3;
            let uPrime = u / (13 * l) + 0.19783000664283;
            let vPrime = v / (13 * l) + 0.46831999493879;
            let x = 0, z = 0;
            if (vPrime !== 0) {
                x = (9 * uPrime * y) / (4 * vPrime);
                z = (12 - 3 * uPrime - 20 * vPrime) * y / (4 * vPrime);
            }
            let r = x *  3.2406 + y * -1.5372 + z * -0.4986;
            let g = x * -0.9689 + y *  1.8758 + z *  0.0415;
            let b_ = x *  0.0557 + y * -0.2040 + z *  1.0570;
            const gamma = val => val > 0.0031308 ? 1.055 * Math.pow(val, 1/2.4) - 0.055 : 12.92 * val;
            return [gamma(r), gamma(g), gamma(b_)];
        }

        // Add Wavelength to RGB (for XYZ proxy)
        function wavelengthToRgb(t) {
            let w = 780 - (t * 400); // Reversed: 780 down to 380 nm
            let r=0, g=0, b=0;
            if(w >= 380 && w < 440) { r = -(w - 440) / (440 - 380); g = 0; b = 1; }
            else if(w >= 440 && w < 490) { r = 0; g = (w - 440) / (490 - 440); b = 1; }
            else if(w >= 490 && w < 510) { r = 0; g = 1; b = -(w - 510) / (510 - 490); }
            else if(w >= 510 && w < 580) { r = (w - 510) / (580 - 510); g = 1; b = 0; }
            else if(w >= 580 && w < 645) { r = 1; g = -(w - 645) / (645 - 580); b = 0; }
            else if(w >= 645 && w <= 780) { r = 1; g = 0; b = 0; }
            
            let factor = 0;
            if(w >= 380 && w < 420) factor = 0.3 + 0.7*(w - 380)/(420 - 380);
            else if(w >= 420 && w < 701) factor = 1.0;
            else if(w >= 701 && w <= 780) factor = 0.3 + 0.7*(780 - w)/(780 - 700);

            const gamma = 0.80;
            const adjust = (c) => c === 0 ? 0 : Math.pow(c * factor, gamma);
            return [adjust(r), adjust(g), adjust(b)];
        }

        // Mock CIE UVW Hue sweep
        function uvwToRgb(t) {
            let angle = t * Math.PI * 2;
            let u = Math.cos(angle);
            let v = Math.sin(angle);
            let r = 0.5 + 0.5 * u;
            let g = 0.5 - 0.25 * u + 0.433 * v;
            let b = 0.5 - 0.5 * v;
            let max = Math.max(r, g, b);
            if (max > 0) { r/=max; g/=max; b/=max; }
            return [Math.max(0,r), Math.max(0,g), Math.max(0,b)];
        }

        // Inline minimal HSLuv implementation to remove CDN dependency
        const HSLuvLib = (function() {
            const m = [[3.2409699419,-1.5373831775,-0.4986107602],[-0.9692436362,1.8759675015,0.0415550574],[0.0556300796,-0.2039769588,1.0572251882]];
            function fromLinear(c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055; }
            function getBounds(L) {
                const sub1 = Math.pow(L + 16, 3) / 1560896;
                const sub2 = sub1 > 0.0088564516 ? sub1 : L / 903.2962962;
                const ret = [];
                for (let c = 0; c < 3; c++) {
                    const m1 = m[c][0], m2 = m[c][1], m3 = m[c][2];
                    for (let t = 0; t < 2; t++) {
                        const top1 = (284517 * m1 - 94839 * m3) * sub2;
                        const top2 = (838422 * m3 + 769860 * m2 + 731718 * m1) * L * sub2 - 769860 * t * L;
                        const bottom = (632260 * m3 - 126452 * m2) * sub2 + 126452 * t;
                        ret.push({ m: top1 / bottom, b: top2 / bottom });
                    }
                }
                return ret;
            }
            return function(H, S, L) {
                if (L >= 99.99) return [1,1,1];
                if (L <= 0.01) return [0,0,0];
                const bounds = getBounds(L);
                const hrad = H / 360 * Math.PI * 2;
                let min = Number.MAX_VALUE;
                for (let i = 0; i < bounds.length; i++) {
                    const l = bounds[i].b / (Math.sin(hrad) - bounds[i].m * Math.cos(hrad));
                    if (l > 0 && l < min) min = l;
                }
                const C = min / 100 * S;
                const U = C * Math.cos(hrad), V = C * Math.sin(hrad);
                const Y = L > 8 ? Math.pow((L + 16) / 116, 3) : L / 903.2962962;
                const uPrime = U / (13 * L) + 0.1978300066;
                const vPrime = V / (13 * L) + 0.4683199949;
                const X = (Y * 9 * uPrime) / (4 * vPrime);
                const Z = (Y * (12 - 3 * uPrime - 20 * vPrime)) / (4 * vPrime);
                const r = fromLinear(X * m[0][0] + Y * m[0][1] + Z * m[0][2]);
                const g = fromLinear(X * m[1][0] + Y * m[1][1] + Z * m[1][2]);
                const b = fromLinear(X * m[2][0] + Y * m[2][1] + Z * m[2][2]);
                return [Math.max(0, Math.min(1, r)), Math.max(0, Math.min(1, g)), Math.max(0, Math.min(1, b))];
            };
        })();

        // HSLuv implementation using the embedded math
        function getHsluv(t) {
            return HSLuvLib(t * 360, 100, 50);
        }

        // 4. Oklch to RGB (Approximation via matrices)
        function oklchToRgb(t) {
            let L = 0.70;
            let C = 0.18; // safe chroma
            let h_radians = t * 360 * Math.PI / 180;
            
            let a = C * Math.cos(h_radians);
            let b = C * Math.sin(h_radians);

            let l_ = L + 0.3963377774 * a + 0.2158037573 * b;
            let m_ = L - 0.1055613458 * a - 0.0638541728 * b;
            let s_ = L - 0.0894841775 * a - 1.2914855480 * b;

            let l = Math.pow(Math.max(0, l_), 3);
            let m = Math.pow(Math.max(0, m_), 3);
            let s = Math.pow(Math.max(0, s_), 3);

            let r_lin =  4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
            let g_lin = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
            let b_lin = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;

            // Simple sRGB Gamma correction
            const gamma = (v) => v > 0.0031308 ? 1.055 * Math.pow(v, 1/2.4) - 0.055 : 12.92 * v;
            
            return [gamma(r_lin), gamma(g_lin), gamma(b_lin)];
        }

        // 5. Simulated LCH (using standard D65 matrices, simplified for speed)
        function lchToRgb(t) {
             let h = t * 360;
             let l = 70, c = 60;
             let hr = h * Math.PI / 180;
             let a = Math.cos(hr) * c;
             let b_lab = Math.sin(hr) * c;
             
             let y = (l + 16) / 116;
             let x = a / 500 + y;
             let z = y - b_lab / 200;

             let x3 = x*x*x, y3 = y*y*y, z3 = z*z*z;
             x = (x3 > 0.008856 ? x3 : (x - 16/116) / 7.787) * 0.95047;
             y = (y3 > 0.008856 ? y3 : (y - 16/116) / 7.787) * 1.00000;
             z = (z3 > 0.008856 ? z3 : (z - 16/116) / 7.787) * 1.08883;

             let r_lin = x *  3.2406 + y * -1.5372 + z * -0.4986;
             let g_lin = x * -0.9689 + y *  1.8758 + z *  0.0415;
             let b_lin = x *  0.0557 + y * -0.2040 + z *  1.0570;

             const gamma = (v) => v > 0.0031308 ? 1.055 * Math.pow(v, 1/2.4) - 0.055 : 12.92 * v;
             return [gamma(r_lin), gamma(g_lin), gamma(b_lin)];
        }

        function colorJsRgb(spaceId, coords) {
            try {
                const color = new Color(spaceId, coords).to('srgb').toGamut({method: 'css'});
                const values = color.coords || color.toJSON().coords;
                return values.map(value => Math.max(0, Math.min(1, Number.isFinite(value) ? value : 0)));
            } catch (error) {
                return [0, 0, 0];
            }
        }

        function cam16UcsToRgb(t) {
            const h = t * 360;
            const jPrime = 55;
            const mPrime = 42;
            const j = jPrime / (1.7 - 0.007 * jPrime);
            const m = (Math.exp(0.0228 * mPrime) - 1) / 0.0228;
            return colorJsRgb('cam16-jmh', [j, m, h]);
        }

        function xyzSweep(t) {
            const angle = t * Math.PI * 2;
            // A balanced chromaticity-plane sweep avoids the coarse red block
            // produced by the old wavelength-to-RGB approximation.
            return colorJsRgb('xyz-d65', [0.45 + 0.32 * Math.cos(angle), 0.55, 0.45 + 0.32 * Math.sin(angle)]);
        }

        function colorJsHueSweep(spaceId, t, coords) {
            const angle = t * Math.PI * 2;
            return colorJsRgb(spaceId, coords(angle));
        }

        // Default order and complete space catalog.
        const initialSpaces = [
            { id: 'sRGB', name: 'sRGB', year: 1996, groups: ['Default', 'SDR', 'RGB'], fn: t => colorJsRgb('srgb', [getSrgb(t)[0], getSrgb(t)[1], getSrgb(t)[2]]), url: 'https://colorjs.io/docs/spaces#srgb' },
            { id: 'XYZ', name: 'CIE XYZ', year: 1931, groups: ['Default', 'SDR', 'CIE'], fn: t => xyzSweep(1 - t), url: 'https://colorjs.io/docs/spaces#xyz-d65' },
            { id: 'UVW', name: 'CIE UVW', year: 1964, groups: ['Default', 'SDR', 'CIE'], fn: t => colorJsRgb('xyz-d65', [0.45 + 0.25 * Math.cos((1 - t) * Math.PI * 2), 0.5, 0.5 + 0.25 * Math.sin((1 - t) * Math.PI * 2)]), url: 'https://en.wikipedia.org/wiki/CIELUV' },
            { id: 'CIELUV', name: 'CIE LUV', year: 1976, groups: ['Default', 'SDR', 'CIE', 'Perceptual'], fn: t => colorJsHueSweep('lchuv', t, a => [70, 60, a * 180 / Math.PI]), url: 'https://colorjs.io/docs/spaces#luv' },
            { id: 'LCH', name: 'CIE LCH', year: 1976, groups: ['Default', 'SDR', 'CIE', 'Perceptual'], fn: t => colorJsHueSweep('lch', t, a => [70, 60, a * 180 / Math.PI]), url: 'https://colorjs.io/docs/spaces#lch' },
            { id: 'OKLCH', name: 'OkLCH', year: 2020, groups: ['Default', 'SDR', 'Perceptual'], fn: t => colorJsHueSweep('oklch', t, a => [0.7, 0.18, a * 180 / Math.PI]), url: 'https://www.w3.org/TR/css-color-4/#ok-lab' },
            { id: 'HSLuv', name: 'HSLuv', year: 2015, groups: ['Default', 'SDR', 'Perceptual'], fn: t => colorJsRgb('hsluv', [t * 360, 100, 50]), url: 'https://www.hsluv.org/' },
            { id: 'ICTCP', name: 'CIE ICtCp', year: 2016, groups: ['HDR', 'Perceptual'], fn: t => colorJsHueSweep('ictcp', t, a => [0.5, 0.22 * Math.cos(a), 0.22 * Math.sin(a)]), url: 'https://colorjs.io/docs/spaces#ictcp' },
            { id: 'Jzazbz', name: 'Jzazbz', year: 2017, groups: ['HDR', 'Perceptual'], fn: t => colorJsHueSweep('jzazbz', t, a => [0.05, 0.03 * Math.cos(a), 0.03 * Math.sin(a)]), url: 'https://colorjs.io/docs/spaces#jzazbz' },
            { id: 'CAM16UCS', name: 'CAM16-UCS', year: 2016, groups: ['HDR', 'Perceptual', 'CIE'], fn: cam16UcsToRgb, url: 'https://www.cie.co.at/technicalcommittees/recommend-cam16-ucs-cie-uniform-colour-space' }
        ];

        let activeSpaces = [...initialSpaces];
        let fullSpaceOrder = [...initialSpaces];
        let sampleCacheKey = '';
        const sampleCache = new Map();

        function enabledSpaceIds() {
            return state.enabledIds || initialSpaces.filter(space => space.groups.includes('Default')).map(space => space.id);
        }

        function rebuildActiveSpaces() {
            const enabled = new Set(enabledSpaceIds());
            activeSpaces = fullSpaceOrder.filter(space => enabled.has(space.id));
            if (!activeSpaces.length) {
                const first = initialSpaces[0];
                state.enabledIds = [first.id];
                activeSpaces = [first];
            }
        }

        function persistState() {
            if (suppressPersistence) return;
            const data = {
                sat: state.sat, tint: state.tint, shade: state.shade, tone: state.tone,
                zoom: state.zoom, order: state.order, inverse: state.inverse,
                format: state.format, selector: state.selector, selectionPinned: state.selectionPinned,
                lastHover: state.lastHover, enabledIds: enabledSpaceIds(), exportFormat: state.exportFormat,
                controlsOpen: state.controlsOpen, fullSpaceOrder: fullSpaceOrder.map(space => space.id)
            };
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (error) { /* file: origins may disable storage */ }
        }

        function restoreState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (!saved) return;
                ['sat', 'tint', 'shade', 'tone', 'zoom', 'order', 'inverse', 'format', 'selector', 'selectionPinned', 'lastHover', 'exportFormat', 'controlsOpen'].forEach(key => {
                    if (saved[key] !== undefined) state[key] = saved[key];
                });
                if (Array.isArray(saved.enabledIds)) state.enabledIds = saved.enabledIds;
                if (Array.isArray(saved.fullSpaceOrder)) {
                    const byId = new Map(initialSpaces.map(space => [space.id, space]));
                    fullSpaceOrder = saved.fullSpaceOrder.map(id => byId.get(id)).filter(Boolean);
                    initialSpaces.forEach(space => { if (!fullSpaceOrder.includes(space)) fullSpaceOrder.push(space); });
                }
            } catch (error) {
                try { localStorage.removeItem(STORAGE_KEY); } catch (ignored) { }
            }
        }

        function invalidateSampleCache() {
            sampleCacheKey = '';
            sampleCache.clear();
        }

        function applyModifiersRgb(rgb) {
            let [r, g, b] = rgb;

            // 1. Saturation
            if (state.sat !== 1.0) {
                let luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                r = luma + state.sat * (r - luma);
                g = luma + state.sat * (g - luma);
                b = luma + state.sat * (b - luma);
            }
            
            // 2. Tint (mix with White)
            if (state.tint > 0) {
                r = r + (1.0 - r) * state.tint;
                g = g + (1.0 - g) * state.tint;
                b = b + (1.0 - b) * state.tint;
            }

            // 3. Shade (mix with Black)
            if (state.shade > 0) {
                r = r * (1.0 - state.shade);
                g = g * (1.0 - state.shade);
                b = b * (1.0 - state.shade);
            }

            // 4. Tone (mix with Neutral Gray 0.5)
            if (state.tone > 0) {
                r = r + (0.5 - r) * state.tone;
                g = g + (0.5 - g) * state.tone;
                b = b + (0.5 - b) * state.tone;
            }

            // Clamp and Format
            r = Math.max(0, Math.min(1, r));
            g = Math.max(0, Math.min(1, g));
            b = Math.max(0, Math.min(1, b));

            let r8 = Math.round(r * 255);
            let g8 = Math.round(g * 255);
            let b8 = Math.round(b * 255);

            return [r8, g8, b8];
        }

        function rgbString(rgb) {
            return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
        }

        function rgbToHsl([r8, g8, b8]) {
            let r = r8 / 255, g = g8 / 255, b = b8 / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0, s = 0, l = (max + min) / 2;
            if (d) {
                s = d / (1 - Math.abs(2 * l - 1));
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    default: h = ((r - g) / d + 4) / 6;
                }
            }
            return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
        }

        function rgbToCmyk([r8, g8, b8]) {
            const r = r8 / 255, g = g8 / 255, b = b8 / 255;
            const k = 1 - Math.max(r, g, b);
            if (k >= 1) return [0, 0, 0, 100];
            return [
                Math.round((1 - r - k) / (1 - k) * 100),
                Math.round((1 - g - k) / (1 - k) * 100),
                Math.round((1 - b - k) / (1 - k) * 100),
                Math.round(k * 100)
            ];
        }

        function formatColor(rgb, format = state.format) {
            const hex = rgb.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
            if (format === 'hex') return hex;
            if (format === 'hashHex') return `#${hex}`;
            if (format === 'rgb') return rgbString(rgb);
            if (format === 'hsl') {
                const [h, s, l] = rgbToHsl(rgb);
                return `hsl(${h}, ${s}%, ${l}%)`;
            }
            const [c, m, y, k] = rgbToCmyk(rgb);
            return `cmyk(${c}%, ${m}%, ${y}%, ${k}%)`;
        }

        function sampleSpace(space) {
            const key = `${state.sat}|${state.tint}|${state.shade}|${state.tone}`;
            if (key !== sampleCacheKey) {
                sampleCacheKey = key;
                sampleCache.clear();
            }
            if (!sampleCache.has(space.id)) {
                sampleCache.set(space.id, Array.from({length: NUM_STOPS}, (_, i) => applyModifiersRgb(space.fn(i / NUM_STOPS))));
            }
            return sampleCache.get(space.id);
        }

        function hueOf(rgb) {
            const [h, s] = rgbToHsl(rgb);
            return {h, chroma: s};
        }

        function hueDistance(a, b) {
            const distance = Math.abs(a - b);
            return Math.min(distance, 360 - distance);
        }

        function getSelectionFor(space, t, targetRgb = null) {
            const samples = sampleSpace(space);
            if (state.selector !== 'closest' || !targetRgb) {
                const index = Math.min(NUM_STOPS - 1, Math.max(0, Math.round(t * (NUM_STOPS - 1))));
                return { index, rgb: samples[index] };
            }
            const targetHue = hueOf(targetRgb);
            let bestIndex = 0, bestScore = Infinity;
            samples.forEach((rgb, index) => {
                const candidate = hueOf(rgb);
                const score = targetHue.chroma < 3 || candidate.chroma < 3
                    ? Math.hypot(rgb[0] - targetRgb[0], rgb[1] - targetRgb[1], rgb[2] - targetRgb[2])
                    : hueDistance(candidate.h, targetHue.h);
                if (score < bestScore) { bestScore = score; bestIndex = index; }
            });
            return { index: bestIndex, rgb: samples[bestIndex] };
        }

        function renderSpectrums() {
            const wrapper = document.getElementById('spectrum-wrapper');
            // Adjust the width of the scrolling container based on zoom
            wrapper.style.width = `${state.zoom * 100}%`;
            
            let html = '';

            activeSpaces.forEach((space, index) => {
                // Generate gradient stops
                let stops = '';
                const samples = sampleSpace(space);
                for (let i = 0; i <= NUM_STOPS; i++) {
                    const sample = samples[i % NUM_STOPS];
                    let finalColor = rgbString(sample);
                    stops += `<stop offset="${(i / NUM_STOPS * 100).toFixed(2)}%" stop-color="${finalColor}" />`;
                }

                // Render row (no vertical space / borders between displays)
                html += `
                    <div class="spectrum-row flex flex-row h-16 w-full" data-index="${index}">
                        <!-- Left sticky label (Drag Handle) -->
                        <div class="space-label w-52 shrink-0 sticky left-0 z-10 bg-gray-900 flex items-center px-4 cursor-grab active:cursor-grabbing hover:bg-gray-800 transition-colors select-none"
                             draggable="true">
                            <div class="flex-1 font-semibold text-gray-200 tracking-wider flex flex-col md:flex-row md:items-baseline">
                                ${space.name}
                                <span class="text-xs text-gray-500 md:ml-2">(${space.year})</span>
                            </div>
                            <div class="text-gray-500 hover:text-white p-2 cursor-help z-20" onclick="showModal('${space.id}')" onmousedown="event.stopPropagation()" title="Click for info">ⓘ</div>
                        </div>
                        
                        <!-- SVG Spectrum -->
                        <div class="flex-1 min-w-0 relative spectrum-canvas cursor-crosshair" data-space-id="${space.id}">
                            <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none">
                                <defs>
                                    <linearGradient id="grad-${space.id}" x1="0%" y1="0%" x2="100%" y2="0%">
                                        ${stops}
                                    </linearGradient>
                                </defs>
                                <rect width="100%" height="100%" fill="url(#grad-${space.id})" />
                            </svg>
                        </div>
                    </div>
                `;
            });

            wrapper.innerHTML = html;
            fitRowHeights();
            renderSelectorOverlays(state.lastHover);
            refreshPinnedPointTooltip();
        }

        function fitRowHeights() {
            const rows = document.querySelectorAll('.spectrum-row');
            const available = scrollContainer ? scrollContainer.clientHeight : 0;
            const height = available > rows.length * COMPACT_ROW_HEIGHT
                ? Math.floor(available / Math.max(1, rows.length))
                : COMPACT_ROW_HEIGHT;
            rows.forEach(row => row.style.height = `${height}px`);
        }

        function setButtonGroup(selector, activeValue, activeClass = 'bg-blue-600') {
            document.querySelectorAll(selector).forEach(button => {
                const active = button.dataset.format === activeValue || button.dataset.selector === activeValue;
                button.classList.toggle(activeClass, active);
                button.classList.toggle('bg-gray-700', !active);
            });
        }

        function renderSelectorOverlays(hover = null) {
            document.querySelectorAll('.selector-marker, .selector-tooltip, .selector-path').forEach(el => el.remove());
            document.querySelectorAll('.point-crosshair').forEach(el => el.remove());
            if (!hover) return;
            if (state.selector === 'point') {
                if (state.selectionPinned && activeSpaces[hover.rowIndex]) {
                    const row = document.querySelector(`.spectrum-row[data-index="${hover.rowIndex}"]`);
                    if (row) {
                        const canvas = row.querySelector('.spectrum-canvas');
                        const selection = getSelectionFor(activeSpaces[hover.rowIndex], hover.t, null);
                        addPointCrosshair(canvas, selection.index / (NUM_STOPS - 1) * canvas.clientWidth);
                    }
                }
                return;
            }
            const rows = [...document.querySelectorAll('.spectrum-row')];
            const targetSpace = activeSpaces[hover.rowIndex];
            const target = getSelectionFor(targetSpace, hover.t, null);
            const targetRgb = target.rgb;
            const selections = rows.map((row, rowIndex) => {
                const canvas = row.querySelector('.spectrum-canvas');
                const selection = getSelectionFor(activeSpaces[rowIndex], hover.t, state.selector === 'closest' ? targetRgb : null);
                const x = (selection.index / (NUM_STOPS - 1)) * canvas.clientWidth;
                return { row, canvas, selection, x };
            });
            const markerElements = selections.map(({canvas, x, selection}) => addMarker(canvas, x, selection.rgb));
            if (state.selector === 'closest') {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.className.baseVal = 'selector-path';
                const wrapperRect = wrapper.getBoundingClientRect();
                const points = selections.map(({row}, index) => {
                    const markerRect = markerElements[index].getBoundingClientRect();
                    const rowRect = row.getBoundingClientRect();
                    return `${markerRect.left - wrapperRect.left + markerRect.width / 2},${rowRect.top - wrapperRect.top + rowRect.height / 2}`;
                }).join(' ');
                const pathWidth = Math.max(1, wrapper.scrollWidth);
                const pathHeight = Math.max(1, wrapper.scrollHeight);
                svg.setAttribute('viewBox', `0 0 ${pathWidth} ${pathHeight}`);
                svg.style.width = `${pathWidth}px`;
                svg.style.height = `${pathHeight}px`;
                const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                polyline.setAttribute('points', points);
                polyline.setAttribute('fill', 'none');
                polyline.setAttribute('stroke', 'white');
                polyline.setAttribute('stroke-width', '3');
                polyline.setAttribute('stroke-dasharray', '5 3');
                svg.appendChild(polyline);
                wrapper.appendChild(svg);
            }
            state.hoverSelections = selections;
        }

        function addMarker(canvas, x, rgb) {
            const marker = document.createElement('div');
            marker.className = 'selector-marker';
            marker.style.left = `${x}px`;
            canvas.appendChild(marker);
            const label = document.createElement('div');
            label.className = 'selector-tooltip';
            label.style.left = `${x}px`;
            label.style.backgroundColor = rgbString(rgb);
            const [r, g, b] = rgb;
            label.style.color = (0.2126 * r + 0.7152 * g + 0.0722 * b) > 128 ? '#000' : '#fff';
            label.textContent = formatColor(rgb);
            label._rgb = rgb;
            canvas.appendChild(label);
            const canvasRect = canvas.getBoundingClientRect();
            let labelRect = label.getBoundingClientRect();
            let correctedX = x;
            if (labelRect.left < canvasRect.left) correctedX += canvasRect.left - labelRect.left;
            if (labelRect.right > canvasRect.right) correctedX -= labelRect.right - canvasRect.right;
            label.style.left = `${Math.max(0, Math.min(canvas.clientWidth, correctedX))}px`;
            return marker;
        }

        function addPointCrosshair(canvas, x) {
            const crosshair = document.createElement('div');
            crosshair.className = 'point-crosshair';
            crosshair.style.left = `${x}px`;
            canvas.appendChild(crosshair);
        }

        function updateSelectedValues(selections) {
            state.selectedValues = selections.map(({space, rgb}) => ({space, rgb}));
            const separator = state.selector === 'point' ? '\n' : '; ';
            document.getElementById('selected-color').value = state.selectedValues.map(item => formatColor(item.rgb)).join(separator);
        }

        function updateSort() {
            if (state.order === 'default') {
                fullSpaceOrder = [...initialSpaces];
            } else if (state.order === 'alpha') {
                fullSpaceOrder = [...initialSpaces].sort((a, b) => a.name.localeCompare(b.name));
            } else if (state.order === 'date') {
                fullSpaceOrder = [...initialSpaces].sort((a, b) => a.year - b.year);
            }
            // If custom, we leave activeSpaces as is (it remembers its order)
            
            if (state.inverse && state.order !== 'custom') {
                fullSpaceOrder.reverse();
            }
            rebuildActiveSpaces();
            persistState();
            renderSpectrums();
        }

        // Attach event listeners for Sliders
        const controls = ['sat', 'tint', 'shade', 'tone', 'zoom'];
        controls.forEach(id => {
            const input = document.getElementById(`ctrl-${id}`);
            const valDisplay = document.getElementById(`val-${id}`);
            input.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                state[id] = val;
                invalidateSampleCache();
                valDisplay.textContent = id === 'zoom' ? val.toFixed(1) + 'x' : val.toFixed(2);
                renderSpectrums();
                persistState();
            });
        });

        // Dropdown Event
        document.getElementById('ctrl-order').addEventListener('change', (e) => {
            state.order = e.target.value;
            updateSort();
        });

        // Inverse Button Event
        document.getElementById('ctrl-inverse').addEventListener('click', (e) => {
            state.inverse = !state.inverse;
            if (state.order === 'custom') {
                fullSpaceOrder.reverse();
                rebuildActiveSpaces();
                persistState();
                renderSpectrums();
            } else {
                e.currentTarget.classList.toggle('bg-blue-600');
                e.currentTarget.classList.toggle('bg-gray-700');
                updateSort();
            }
        });

        // Reset Zoom Event
        document.getElementById('btn-reset-zoom').addEventListener('click', () => {
            state.zoom = 1.0;
            document.getElementById('ctrl-zoom').value = state.zoom;
            document.getElementById('val-zoom').textContent = state.zoom.toFixed(1) + 'x';
            renderSpectrums();
            scrollContainer.scrollLeft = 0;
            persistState();
        });

        function resetSliders() {
            state.sat = 1.0;
            state.tint = 0.0;
            state.shade = 0.0;
            state.tone = 0.0;
            state.zoom = 1.0;
            invalidateSampleCache();
            controls.forEach(id => {
                const val = state[id];
                document.getElementById(`ctrl-${id}`).value = val;
                document.getElementById(`val-${id}`).textContent = id === 'zoom' ? val.toFixed(1) + 'x' : val.toFixed(2);
            });
            renderSpectrums();
            scrollContainer.scrollLeft = 0;
            persistState();
        }

        function resetEverything() {
            resetSliders();
            state.order = 'default';
            state.inverse = false;
            state.format = 'rgb';
            state.selector = 'point';
            state.selectedValues = [];
            state.selectionPinned = false;
            state.lastHover = null;
            state.enabledIds = null;
            state.exportFormat = 'svg';
            state.controlsOpen = true;
            fullSpaceOrder = [...initialSpaces];
            try { localStorage.removeItem(STORAGE_KEY); } catch (ignored) { }
            document.getElementById('selected-color').value = '';
            setButtonGroup('.format-button', state.format);
            setButtonGroup('.selector-button', state.selector);
            updateSaveButtons();
            renderSpacesPopover();
            // Update Order Dropdown and Inverse Button
            document.getElementById('ctrl-order').value = 'default';
            document.getElementById('ctrl-inverse').classList.remove('bg-blue-600');
            document.getElementById('ctrl-inverse').classList.add('bg-gray-700');
            
            // Reset Pan and re-render
            suppressPersistence = true;
            updateSort();
            suppressPersistence = false;
            document.getElementById('top-controls').open = true;
            scrollContainer.scrollLeft = 0;
        }

        document.getElementById('btn-reset-sliders').addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            resetSliders();
        });
        document.getElementById('reset-menu-button').addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            const menu = document.getElementById('reset-menu');
            menu.classList.toggle('hidden');
            event.currentTarget.setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
        });
        document.querySelector('#reset-menu [data-reset="all"]').addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            resetEverything();
            document.getElementById('reset-menu').classList.add('hidden');
            document.getElementById('reset-menu-button').setAttribute('aria-expanded', 'false');
        });

        const wrapper = document.getElementById('spectrum-wrapper');
        const scrollContainer = wrapper.parentElement;

        // Interactive States
        let isPanning = false;
        let startX;
        let scrollLeftPos;
        const tooltip = document.getElementById('color-tooltip');

        function displayTooltip(rgb, x, y, pinned = false) {
            const colorStr = formatColor(rgb);
            tooltip.textContent = colorStr;
            tooltip.style.backgroundColor = rgbString(rgb);
            const [r, g, b] = rgb;
            const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            tooltip.style.color = luma > 128 ? '#000' : '#fff';
            tooltip.style.transform = pinned ? 'translateY(-50%)' : 'translate(15px, 15px)';
            tooltip.classList.remove('hidden');
            const viewport = scrollContainer.getBoundingClientRect();
            const firstLabel = document.querySelector('.space-label');
            const minX = viewport.left + (firstLabel ? firstLabel.getBoundingClientRect().width : 0) + 2;
            const maxX = Math.max(minX, viewport.right - tooltip.offsetWidth - 2);
            const desiredLeft = pinned ? x + 15 : x;
            const left = pinned
                ? Math.max(minX, Math.min(maxX, desiredLeft))
                : Math.max(minX - 15, Math.min(maxX - 15, desiredLeft));
            tooltip.style.left = `${left}px`;
            tooltip.style.top = `${y}px`;
        }

        function refreshPinnedPointTooltip() {
            if (!state.selectionPinned || state.selector !== 'point' || !state.lastHover) return;
            const row = document.querySelector(`.spectrum-row[data-index="${state.lastHover.rowIndex}"]`);
            const crosshair = row?.querySelector('.point-crosshair');
            if (!row || !crosshair) return;
            const selection = getSelectionFor(activeSpaces[state.lastHover.rowIndex], state.lastHover.t, null);
            const rowRect = row.getBoundingClientRect();
            const crosshairRect = crosshair.getBoundingClientRect();
            displayTooltip(selection.rgb, crosshairRect.left, rowRect.top + rowRect.height / 2, true);
        }

        window.addEventListener('resize', fitRowHeights);

        document.querySelectorAll('.format-button').forEach(button => button.addEventListener('click', () => {
            state.format = button.dataset.format;
            setButtonGroup('.format-button', state.format);
            document.querySelectorAll('.selector-tooltip').forEach(label => {
                const marker = label.previousElementSibling;
                if (marker) label.textContent = formatColor(label._rgb || [0, 0, 0]);
            });
            const separator = state.selector === 'point' ? '\n' : '; ';
            document.getElementById('selected-color').value = state.selectedValues.map(item => formatColor(item.rgb)).join(separator);
            renderSelectorOverlays(state.lastHover);
            persistState();
        }));

        document.querySelectorAll('.selector-button').forEach(button => button.addEventListener('click', () => {
            state.selector = button.dataset.selector;
            setButtonGroup('.selector-button', state.selector);
            renderSelectorOverlays(state.lastHover);
            const separator = state.selector === 'point' ? '\n' : '; ';
            document.getElementById('selected-color').value = state.selectedValues.map(item => formatColor(item.rgb)).join(separator);
            persistState();
        }));

        document.getElementById('copy-color').addEventListener('click', async () => {
            const field = document.getElementById('selected-color');
            if (!field.value) return;
            try {
                await navigator.clipboard.writeText(field.value);
                document.getElementById('selection-status').textContent = 'Copied';
                setTimeout(() => document.getElementById('selection-status').textContent = '', 1200);
            } catch (error) {
                field.select();
                document.getElementById('selection-status').textContent = 'Select and copy manually';
            }
        });

        // Panning and Tooltip Mouse Events
        wrapper.addEventListener('mousedown', (e) => {
            const canvas = e.target.closest('.spectrum-canvas');
            if (canvas) {
                isPanning = true;
                wrapper.classList.add('grabbing');
                startX = e.pageX - scrollContainer.offsetLeft;
                scrollLeftPos = scrollContainer.scrollLeft;
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            wrapper.classList.remove('grabbing');
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                e.preventDefault();
                const x = e.pageX - scrollContainer.offsetLeft;
                const walk = (x - startX) * 1.5; // Panning speed multiplier
                scrollContainer.scrollLeft = scrollLeftPos - walk;
            }
            if (state.selectionPinned) return;
            
            // Tooltip processing
            const canvas = e.target.closest('.spectrum-canvas');
            if (canvas && !isPanning) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const width = rect.width;
                const t = Math.max(0, Math.min(1, x / width));
                
                const row = canvas.closest('.spectrum-row');
                const spaceIndex = parseInt(row.dataset.index);
                const space = activeSpaces[spaceIndex];
                
                const rgb = applyModifiersRgb(space.fn(t));
                
                if (state.selector === 'point') {
                    displayTooltip(rgb, e.clientX, e.clientY, false);
                } else {
                    tooltip.classList.add('hidden');
                }
                state.lastHover = {t, rowIndex: spaceIndex};
                if (state.selector !== 'point') {
                    renderSelectorOverlays(state.lastHover);
                    const target = getSelectionFor(activeSpaces[spaceIndex], t, null);
                    const selections = activeSpaces.map((space, rowIndex) => {
                        const selected = getSelectionFor(space, t, state.selector === 'closest' ? target.rgb : null);
                        return {space, rgb: selected.rgb, rowIndex};
                    });
                    updateSelectedValues(selections);
                }
            } else {
                tooltip.classList.add('hidden');
            }
        });

        wrapper.addEventListener('click', (e) => {
            const canvas = e.target.closest('.spectrum-canvas');
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            const t = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const row = canvas.closest('.spectrum-row');
            const rowIndex = parseInt(row.dataset.index);
            if (state.selectionPinned) {
                state.selectionPinned = false;
                persistState();
                tooltip.style.transform = 'translate(15px, 15px)';
                tooltip.classList.add('hidden');
                state.lastHover = {t, rowIndex};
                renderSelectorOverlays(state.lastHover);
                return;
            }
            const target = getSelectionFor(activeSpaces[rowIndex], t, null);
            const selections = state.selector === 'point'
                ? [{space: activeSpaces[rowIndex], rgb: target.rgb, rowIndex}]
                : activeSpaces.map((space, index) => {
                    const selected = getSelectionFor(space, t, state.selector === 'closest' ? target.rgb : null);
                    return {space, rgb: selected.rgb, rowIndex: index};
                });
            state.selectedRgb = target.rgb;
            state.selectionPinned = true;
            state.lastHover = {t, rowIndex};
            updateSelectedValues(selections);
            renderSelectorOverlays(state.lastHover);
            if (state.selector === 'point') {
                const selectedRow = row.getBoundingClientRect();
                displayTooltip(target.rgb, e.clientX, selectedRow.top + selectedRow.height / 2, true);
            }
            persistState();
        });

        wrapper.addEventListener('mouseleave', () => {
            if (!state.selectionPinned) tooltip.classList.add('hidden');
        });

        function zoomAtPointer(e, newZoom) {
            const rect = scrollContainer.getBoundingClientRect();
            const canvas = e.target.closest('.spectrum-canvas');
            if (!canvas) return;
            const pointerViewportX = e.clientX - rect.left;
            const labelWidth = canvas.closest('.spectrum-row').querySelector('.space-label').offsetWidth;
            const oldSpectrumWidth = Math.max(1, wrapper.scrollWidth - labelWidth);
            const pointerContentX = pointerViewportX + scrollContainer.scrollLeft;
            const ratio = Math.max(0, Math.min(1, (pointerContentX - labelWidth) / oldSpectrumWidth));
            state.zoom = newZoom;
            document.getElementById('ctrl-zoom').value = state.zoom;
            document.getElementById('val-zoom').textContent = state.zoom.toFixed(1) + 'x';
            renderSpectrums();
            const newSpectrumWidth = Math.max(1, wrapper.scrollWidth - labelWidth);
            const targetScroll = labelWidth + ratio * newSpectrumWidth - pointerViewportX;
            scrollContainer.scrollLeft = Math.max(0, targetScroll);
            refreshPinnedPointTooltip();
            requestAnimationFrame(() => {
                scrollContainer.scrollLeft = Math.max(0, targetScroll);
                refreshPinnedPointTooltip();
            });
            persistState();
        }

        // Zoom Control via Mouse Wheel (Pinch) and Double Click
        scrollContainer.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                
                let zoomChange = e.deltaY * -0.01;
                const newZoom = Math.max(1, Math.min(10, state.zoom + zoomChange));
                
                if (newZoom === state.zoom) return;
                zoomAtPointer(e, newZoom);
            }
        }, { passive: false });

        scrollContainer.addEventListener('dblclick', (e) => {
            if (e.target.closest('.spectrum-canvas')) {
                const newZoom = state.zoom >= 10 ? 1 : Math.min(10, state.zoom + 2);
                if (newZoom === state.zoom) return;
                zoomAtPointer(e, newZoom);
            }
        });

        // Drag & Drop Reordering
        wrapper.addEventListener('dragstart', (e) => {
            const label = e.target.closest('.space-label');
            if (!label) {
                e.preventDefault();
                return;
            }
            
            // Auto switch to custom sort when dragging names
            if (state.order !== 'custom') {
                state.order = 'custom';
                document.getElementById('ctrl-order').value = 'custom';
            }

            const row = label.closest('.spectrum-row');
            state.draggedItemIndex = parseInt(row.dataset.index);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => row.classList.add('opacity-50'), 0);
        });

        wrapper.addEventListener('dragend', (e) => {
            const row = e.target.closest('.spectrum-row');
            if (row) row.classList.remove('opacity-50');
            document.querySelectorAll('.spectrum-row').forEach(el => el.classList.remove('drag-over'));
        });

        wrapper.addEventListener('dragover', (e) => {
            if (state.order !== 'custom') return;
            e.preventDefault(); 
            const row = e.target.closest('.spectrum-row');
            if (row && parseInt(row.dataset.index) !== state.draggedItemIndex) {
                row.classList.add('drag-over');
            }
        });

        wrapper.addEventListener('dragleave', (e) => {
            if (state.order !== 'custom') return;
            const row = e.target.closest('.spectrum-row');
            if (row) row.classList.remove('drag-over');
        });

        wrapper.addEventListener('drop', (e) => {
            if (state.order !== 'custom') return;
            e.preventDefault();
            const row = e.target.closest('.spectrum-row');
            if (!row) return;
            
            const targetIndex = parseInt(row.dataset.index);
            if (targetIndex !== state.draggedItemIndex && state.draggedItemIndex !== null) {
                const item = activeSpaces.splice(state.draggedItemIndex, 1)[0];
                activeSpaces.splice(targetIndex, 0, item);
                const enabled = new Set(enabledSpaceIds());
                let activeIndex = 0;
                fullSpaceOrder = fullSpaceOrder.map(space => enabled.has(space.id) ? activeSpaces[activeIndex++] : space);
                persistState();
                renderSpectrums();
            }
        });

        const modal = document.getElementById('info-modal');
        const modalContent = document.getElementById('modal-content-box');
        let modalSpace = null;

        function exportFilename(space, extension) {
            const safeName = space.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
            return `${safeName}_sat-${state.sat.toFixed(2)}_tint-${state.tint.toFixed(2)}_shade-${state.shade.toFixed(2)}_tone-${state.tone.toFixed(2)}.${extension}`;
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        function exportPayload(space) {
            return {
                name: space.name,
                sat: state.sat,
                tint: state.tint,
                shade: state.shade,
                tone: state.tone,
                colors: sampleSpace(space).map(rgb => formatColor(rgb))
            };
        }

        function exportSelectionFor(space, index) {
            if (!state.selectionPinned || !state.lastHover) return null;
            const target = getSelectionFor(activeSpaces[state.lastHover.rowIndex] || space, state.lastHover.t, null);
            return getSelectionFor(space, state.lastHover.t, state.selector === 'closest' ? target.rgb : null);
        }

        function escapeXml(value) {
            return String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[character]));
        }

        function saveSpaceCollection(spaces, format, filenameBase, includeSelection = false, includeLabels = spaces.length > 1) {
            if (!spaces.length) return;
            if (format === 'json') {
                const payload = spaces.map(exportPayload);
                downloadBlob(new Blob([JSON.stringify(payload.length === 1 ? payload[0] : payload, null, 2)], {type: 'application/json'}), `${filenameBase}.json`);
                return;
            }
            const firstRow = document.querySelector('.spectrum-row');
            const rowHeight = firstRow ? firstRow.clientHeight : COMPACT_ROW_HEIGHT;
            const width = Math.max(1, scrollContainer.clientWidth);
            const labelWidth = includeLabels && firstRow ? firstRow.querySelector('.space-label').clientWidth : 0;
            const gradientWidth = Math.max(1, width - labelWidth);
            const height = Math.max(1, rowHeight * spaces.length);
            const selectionLines = [];
            if (includeSelection && state.selectionPinned && state.lastHover) {
                spaces.forEach((space, index) => {
                    const selection = exportSelectionFor(space, index);
                    if (selection) selectionLines.push({
                        x: selection.index / (NUM_STOPS - 1) * gradientWidth + labelWidth,
                        y: index * rowHeight + rowHeight / 2,
                        value: formatColor(selection.rgb)
                    });
                });
            }
            const exportLabels = selectionLines.map(line => ({
                ...line,
                width: Math.max(84, line.value.length * 6.8 + 14),
            }));
            exportLabels.forEach(line => {
                line.labelX = Math.max(line.width / 2, Math.min(width - line.width / 2, line.x));
            });
            if (format === 'svg') {
                const defs = spaces.map((space, index) => {
                    const stops = sampleSpace(space).map((rgb, i) => `<stop offset="${(i / (NUM_STOPS - 1) * 100).toFixed(3)}%" stop-color="${rgbString(rgb)}"/>`).join('');
                    return `<linearGradient id="g${index}" x1="0" x2="1" y1="0" y2="0">${stops}</linearGradient>`;
                }).join('');
                const rows = spaces.map((space, index) => `${includeLabels ? `<rect width="${labelWidth}" height="${rowHeight}" y="${index * rowHeight}" fill="#111827"/><text x="${labelWidth - 12}" text-anchor="end" y="${index * rowHeight + rowHeight / 2 + 5}" fill="white" font-family="sans-serif" font-size="14">${escapeXml(space.name)}</text>` : ''}<rect x="${labelWidth}" y="${index * rowHeight}" width="${gradientWidth}" height="${rowHeight}" fill="url(#g${index})"/>`).join('');
                const lines = selectionLines.map(line => `<line x1="${line.x - 4}" x2="${line.x - 4}" y1="${line.y - rowHeight / 2}" y2="${line.y + rowHeight / 2}" stroke="white" stroke-width="2"/><line x1="${line.x + 4}" x2="${line.x + 4}" y1="${line.y - rowHeight / 2}" y2="${line.y + rowHeight / 2}" stroke="black" stroke-width="2"/>`).join('');
                const path = state.selector === 'closest' && selectionLines.length > 1
                    ? `<polyline points="${selectionLines.map(line => `${line.x},${line.y}`).join(' ')}" fill="none" stroke="white" stroke-width="2" stroke-dasharray="2 4"/>`
                    : '';
                const labels = exportLabels.map(line => `<rect x="${line.labelX - line.width / 2}" y="${line.y - 10}" width="${line.width}" height="20" rx="4" fill="rgba(0,0,0,.65)"/><text x="${line.labelX}" y="${line.y + 4}" text-anchor="middle" fill="white" font-family="monospace" font-size="11">${escapeXml(line.value)}</text>`).join('');
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><defs>${defs}</defs>${rows}${path}${lines}${labels}</svg>`;
                downloadBlob(new Blob([svg], {type: 'image/svg+xml'}), `${filenameBase}.svg`);
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            spaces.forEach((space, index) => {
                const samples = sampleSpace(space);
                samples.forEach((rgb, i) => {
                    context.fillStyle = rgbString(rgb);
                    context.fillRect(labelWidth + i / NUM_STOPS * gradientWidth, index * rowHeight, gradientWidth / NUM_STOPS + 1, rowHeight);
                });
                if (includeLabels) {
                    context.fillStyle = '#111827';
                    context.fillRect(0, index * rowHeight, labelWidth, rowHeight);
                    context.fillStyle = 'white';
                    context.font = '14px sans-serif';
                    context.textAlign = 'right';
                    context.fillText(space.name, labelWidth - 12, index * rowHeight + rowHeight / 2 + 5);
                }
            });
            selectionLines.forEach(line => {
                context.strokeStyle = 'white'; context.lineWidth = 2;
                context.beginPath(); context.moveTo(line.x - 4, line.y - rowHeight / 2); context.lineTo(line.x - 4, line.y + rowHeight / 2); context.stroke();
                context.strokeStyle = 'black';
                context.beginPath(); context.moveTo(line.x + 4, line.y - rowHeight / 2); context.lineTo(line.x + 4, line.y + rowHeight / 2); context.stroke();
            });
            if (state.selector === 'closest' && selectionLines.length > 1) {
                context.strokeStyle = 'white';
                context.lineWidth = 2;
                context.setLineDash([2, 4]);
                context.beginPath();
                selectionLines.forEach((line, index) => index ? context.lineTo(line.x, line.y) : context.moveTo(line.x, line.y));
                context.stroke();
                context.setLineDash([]);
            }
            exportLabels.forEach(line => {
                context.font = '11px monospace';
                context.textAlign = 'center';
                context.fillStyle = 'rgba(0,0,0,.55)';
                context.fillRect(line.labelX - line.width / 2, line.y - 10, line.width, 20);
                context.fillStyle = 'white';
                context.fillText(line.value, line.labelX, line.y + 4);
            });
            const mime = format === 'webp' ? 'image/webp' : 'image/png';
            const extension = format === 'webp' ? 'webp' : 'png';
            canvas.toBlob(blob => { if (blob) downloadBlob(blob, `${filenameBase}.${extension}`); }, mime);
        }
        
        function showModal(spaceId) {
            const space = initialSpaces.find(s => s.id === spaceId);
            if (!space) return;
            modalSpace = space;

            document.getElementById('modal-title').textContent = space.name;
            document.getElementById('modal-body').innerHTML = `${spaceInfo[spaceId] || "Information not available."}<br><a class="text-blue-300 hover:text-blue-200 underline" href="${space.url}" target="_blank" rel="noopener">More information</a>`;
            
            modal.classList.remove('hidden');
            // Trigger reflow to apply transition
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
        }

        function hideModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('modal-close').addEventListener('click', hideModal);
        document.getElementById('modal-save').addEventListener('click', () => {
            if (modalSpace) saveSpaceCollection([modalSpace], state.exportFormat, exportFilename(modalSpace, '').replace(/\.$/, ''), true, false);
        });
        function updateSaveButtons() {
            const label = `Save ${state.exportFormat.toUpperCase()}`;
            document.getElementById('save-all').textContent = label;
            document.getElementById('modal-save').textContent = label;
            document.querySelectorAll('[data-save-format]').forEach(button => button.classList.toggle('active', button.dataset.saveFormat === state.exportFormat));
        }

        function setExportFormat(format) {
            state.exportFormat = format;
            updateSaveButtons();
            persistState();
        }

        function toggleMenu(buttonId, menuId) {
            const button = document.getElementById(buttonId);
            const menu = document.getElementById(menuId);
            menu.classList.toggle('hidden');
            button.setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
        }

        document.getElementById('save-menu-button').addEventListener('click', event => {
            event.preventDefault(); event.stopPropagation(); toggleMenu('save-menu-button', 'save-menu');
        });
        document.getElementById('modal-save-menu-button').addEventListener('click', event => {
            event.preventDefault(); event.stopPropagation(); toggleMenu('modal-save-menu-button', 'modal-save-menu');
        });
        document.querySelectorAll('[data-save-format]').forEach(button => button.addEventListener('click', event => {
            event.preventDefault(); event.stopPropagation();
            setExportFormat(button.dataset.saveFormat);
            const menu = button.closest('.split-menu');
            menu.classList.add('hidden');
            menu.previousElementSibling.setAttribute('aria-expanded', 'false');
