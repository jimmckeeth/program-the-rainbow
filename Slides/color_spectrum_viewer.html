<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Spectrum Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280; 
        }
        /* Hide scrollbar for the main view but keep functionality */
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .drag-over {
            border-top: 4px solid #3b82f6;
            opacity: 0.8;
        }
        .color-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            transform: translate(15px, 15px);
            border: 1px solid #4b5563;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
        .grabbing {
            cursor: grabbing !important;
        }
        .selector-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 0;
            border-left: 2px solid rgba(255,255,255,0.95);
            border-right: 2px solid rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 5;
        }
        .selector-tooltip {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            pointer-events: none;
            padding: 2px 5px;
            border-radius: 3px;
            font: 11px monospace;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.65);
            box-shadow: 0 1px 3px rgba(0,0,0,.5);
        }
        .selector-path {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: visible;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Control Panel -->
    <div class="bg-gray-800 border-b border-gray-700 p-4 shrink-0 shadow-lg z-20">
        <div class="max-w-7xl mx-auto">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold text-blue-400">Color Spectrum Viewer</h1>
                <button id="btn-reset-all" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded shadow text-sm transition-colors">Reset All</button>
            </div>
            
            <!-- Controls Grid -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 text-sm">
                
                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Saturation</span>
                        <span id="val-sat" class="text-blue-300 font-mono">1.0</span>
                    </label>
                    <input type="range" id="ctrl-sat" min="0" max="2" step="0.05" value="1" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Tint</span>
                        <span id="val-tint" class="text-blue-300 font-mono">0.0</span>
                    </label>
                    <input type="range" id="ctrl-tint" min="0" max="1" step="0.01" value="0" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Shade</span>
                        <span id="val-shade" class="text-blue-300 font-mono">0.0</span>
                    </label>
                    <input type="range" id="ctrl-shade" min="0" max="1" step="0.01" value="0" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1">
                        <span class="text-gray-300">Tone</span>
                        <span id="val-tone" class="text-blue-300 font-mono">0.0</span>
                    </label>
                    <input type="range" id="ctrl-tone" min="0" max="1" step="0.01" value="0" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col">
                    <label class="flex justify-between mb-1 items-center">
                        <span class="text-gray-300">Zoom</span>
                        <div class="flex space-x-2 items-center">
                            <button id="btn-reset-zoom" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-0.5 rounded text-gray-200">Reset</button>
                            <span id="val-zoom" class="text-blue-300 font-mono">1.0x</span>
                        </div>
                    </label>
                    <input type="range" id="ctrl-zoom" min="1" max="10" step="0.1" value="1" class="accent-blue-500 cursor-pointer">
                </div>

                <div class="flex flex-col justify-end">
                    <label class="mb-1 text-gray-300">Order</label>
                    <div class="flex space-x-2">
                        <select id="ctrl-order" class="bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 focus:outline-none focus:border-blue-500 cursor-pointer flex-1">
                            <option value="default">Default</option>
                            <option value="alpha">Alphabetical</option>
                            <option value="date">Date</option>
                            <option value="custom">Custom</option>
                        </select>
                        <button id="ctrl-inverse" class="bg-gray-700 text-white border border-gray-600 rounded px-2 py-1 hover:bg-gray-600 focus:outline-none transition-colors" title="Toggle Inverse">
                            ↓↑
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Spectrum Container -->
    <div class="flex-1 overflow-y-auto overflow-x-auto relative bg-gray-950">
        <div id="spectrum-wrapper" class="flex flex-col min-w-full transition-all duration-150 ease-out">
            <!-- Spectrums will be injected here via JS -->
        </div>
    </div>

    <!-- Bottom Selection and Format Controls -->
    <div class="bg-gray-800 border-t border-gray-700 p-3 shrink-0 z-20">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-2 text-sm">
            <div class="flex items-center gap-1" role="group" aria-label="Color format">
                <span class="text-gray-400 mr-1">Format</span>
                <button class="format-button bg-blue-600 text-white px-2 py-1 rounded" data-format="hex">HEX</button>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="hashHex">#HEX</button>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="rgb">RGB</button>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="hsl">HSL</button>
                <button class="format-button bg-gray-700 text-white px-2 py-1 rounded" data-format="cmyk">CMYK</button>
            </div>
            <div class="flex items-center gap-1" role="group" aria-label="Selection mode">
                <span class="text-gray-400 ml-2 mr-1">Select</span>
                <button class="selector-button bg-blue-600 text-white px-2 py-1 rounded" data-selector="point">Point</button>
                <button class="selector-button bg-gray-700 text-white px-2 py-1 rounded" data-selector="vertical">Vertical</button>
                <button class="selector-button bg-gray-700 text-white px-2 py-1 rounded" data-selector="closest">Closest</button>
            </div>
            <textarea id="selected-color" rows="1" readonly placeholder="Click a spectrum to select a color"
                   class="flex-1 min-w-[220px] max-h-20 bg-gray-900 border border-gray-600 rounded px-3 py-1 text-white font-mono focus:outline-none resize-y"></textarea>
            <button id="copy-color" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1 rounded">Copy</button>
            <span id="selection-status" class="text-xs text-gray-400" aria-live="polite"></span>
        </div>
    </div>

    <!-- Info Modal -->
    <div id="color-tooltip" class="color-tooltip hidden">#000000</div>
    <div id="info-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 max-w-lg w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-200" id="modal-content-box">
            <h2 id="modal-title" class="text-2xl font-bold text-blue-400 mb-2">Color Space Name</h2>
            <div id="modal-body" class="text-gray-300 space-y-4 mb-6 leading-relaxed">
                <!-- Content injected here -->
            </div>
            <div class="flex flex-wrap justify-end items-center gap-2">
                <select id="save-format" class="bg-gray-700 text-white border border-gray-600 rounded px-2 py-2">
                    <option value="svg">SVG</option>
                    <option value="png">PNG</option>
                    <option value="json">JSON</option>
                </select>
                <button id="modal-save" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded shadow transition-colors">Save</button>
                <button id="modal-close" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        const state = {
            sat: 1.0,
            tint: 0.0,
            shade: 0.0,
            tone: 0.0,
            zoom: 1.0,
            order: 'default',
            inverse: false,
            draggedItemIndex: null,
            format: 'hex',
            selector: 'point',
            selectedRgb: null,
            selectedValues: []
        };

        const NUM_STOPS = 360;
        const COMPACT_ROW_HEIGHT = 64;

        // Information text for each space
        const spaceInfo = {
            sRGB: "<b>sRGB (Standard RGB) (1996)</b><br>The standard color space for the web. Interpolating hue fully saturates the primary and secondary vertices of the RGB cube. Visually identical to basic HSL/HSV sweeps at max saturation.",
            XYZ: "<b>CIE 1931 XYZ (1931)</b><br>The foundational color space mapping human vision. Displayed here as a sweep of physical wavelengths (approx 780nm to 380nm) across the visible spectrum.",
            UVW: "<b>CIE 1964 UVW (1964)</b><br>An early attempt at a perceptually uniform color space. Sweeping the chromaticity plane creates a different distribution of hues compared to standard RGB.",
            CIELAB: "<b>CIE LAB (1976)</b><br>A perceptually uniform space designed to approximate human vision. Displayed here via its cylindrical LCH coordinate system.",
            CIELUV: "<b>CIE LUV (1976)</b><br>Another perceptually uniform space from 1976, heavily used for displays. Swept via its cylindrical LCHuv coordinates.",
            HSLuv: "<b>HSLuv (2015)</b><br>A human-friendly alternative to HSL, based on the CIELUV color space. It maintains perceptual uniformity, preventing the harsh luminance shifts seen in standard HSL.",
            OKLCH: "<b>Oklch (Perceptual) (2020)</b><br>A modern perceptually uniform color space. Sweeps through Hue angles while maintaining a constant Lightness and Chroma, preserving perceived brightness flawlessly.",
            LCH: "<b>CIE L*C*h° (1976)</b><br>A cylindrical representation of the CIELAB color space. Sweeping Hue maintains perceived lightness and chroma, though it exhibits slight blue-to-purple hue shifts compared to Oklch."
        };

        
        // 1. sRGB Sweep: Red -> Yellow -> Green -> Cyan -> Blue -> Magenta -> Red
        function getSrgb(t) {
            let h = t * 6; // 0 to 6
            let r=0, g=0, b=0;
            if (h < 1) { r = 1; g = h; b = 0; }
            else if (h < 2) { r = 2-h; g = 1; b = 0; }
            else if (h < 3) { r = 0; g = 1; b = h-2; }
            else if (h < 4) { r = 0; g = 4-h; b = 1; }
            else if (h < 5) { r = h-4; g = 0; b = 1; }
            else { r = 1; g = 0; b = 6-h; }
            return [r, g, b];
        }

        // CIELUV Hue Sweep
        function lchUvToRgb(t) {
            let h = t * 360; let l = 70; let c = 60;
            let hr = h * Math.PI / 180;
            let u = c * Math.cos(hr); let v = c * Math.sin(hr);
            let y = l > 8 ? Math.pow((l + 16) / 116, 3) : l / 903.3;
            let uPrime = u / (13 * l) + 0.19783000664283;
            let vPrime = v / (13 * l) + 0.46831999493879;
            let x = 0, z = 0;
            if (vPrime !== 0) {
                x = (9 * uPrime * y) / (4 * vPrime);
                z = (12 - 3 * uPrime - 20 * vPrime) * y / (4 * vPrime);
            }
            let r = x *  3.2406 + y * -1.5372 + z * -0.4986;
            let g = x * -0.9689 + y *  1.8758 + z *  0.0415;
            let b_ = x *  0.0557 + y * -0.2040 + z *  1.0570;
            const gamma = val => val > 0.0031308 ? 1.055 * Math.pow(val, 1/2.4) - 0.055 : 12.92 * val;
            return [gamma(r), gamma(g), gamma(b_)];
        }

        // Add Wavelength to RGB (for XYZ proxy)
        function wavelengthToRgb(t) {
            let w = 780 - (t * 400); // Reversed: 780 down to 380 nm
            let r=0, g=0, b=0;
            if(w >= 380 && w < 440) { r = -(w - 440) / (440 - 380); g = 0; b = 1; }
            else if(w >= 440 && w < 490) { r = 0; g = (w - 440) / (490 - 440); b = 1; }
            else if(w >= 490 && w < 510) { r = 0; g = 1; b = -(w - 510) / (510 - 490); }
            else if(w >= 510 && w < 580) { r = (w - 510) / (580 - 510); g = 1; b = 0; }
            else if(w >= 580 && w < 645) { r = 1; g = -(w - 645) / (645 - 580); b = 0; }
            else if(w >= 645 && w <= 780) { r = 1; g = 0; b = 0; }
            
            let factor = 0;
            if(w >= 380 && w < 420) factor = 0.3 + 0.7*(w - 380)/(420 - 380);
            else if(w >= 420 && w < 701) factor = 1.0;
            else if(w >= 701 && w <= 780) factor = 0.3 + 0.7*(780 - w)/(780 - 700);

            const gamma = 0.80;
            const adjust = (c) => c === 0 ? 0 : Math.pow(c * factor, gamma);
            return [adjust(r), adjust(g), adjust(b)];
        }

        // Mock CIE UVW Hue sweep
        function uvwToRgb(t) {
            let angle = t * Math.PI * 2;
            let u = Math.cos(angle);
            let v = Math.sin(angle);
            let r = 0.5 + 0.5 * u;
            let g = 0.5 - 0.25 * u + 0.433 * v;
            let b = 0.5 - 0.5 * v;
            let max = Math.max(r, g, b);
            if (max > 0) { r/=max; g/=max; b/=max; }
            return [Math.max(0,r), Math.max(0,g), Math.max(0,b)];
        }

        // Inline minimal HSLuv implementation to remove CDN dependency
        const HSLuvLib = (function() {
            const m = [[3.2409699419,-1.5373831775,-0.4986107602],[-0.9692436362,1.8759675015,0.0415550574],[0.0556300796,-0.2039769588,1.0572251882]];
            function fromLinear(c) { return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1/2.4) - 0.055; }
            function getBounds(L) {
                const sub1 = Math.pow(L + 16, 3) / 1560896;
                const sub2 = sub1 > 0.0088564516 ? sub1 : L / 903.2962962;
                const ret = [];
                for (let c = 0; c < 3; c++) {
                    const m1 = m[c][0], m2 = m[c][1], m3 = m[c][2];
                    for (let t = 0; t < 2; t++) {
                        const top1 = (284517 * m1 - 94839 * m3) * sub2;
                        const top2 = (838422 * m3 + 769860 * m2 + 731718 * m1) * L * sub2 - 769860 * t * L;
                        const bottom = (632260 * m3 - 126452 * m2) * sub2 + 126452 * t;
                        ret.push({ m: top1 / bottom, b: top2 / bottom });
                    }
                }
                return ret;
            }
            return function(H, S, L) {
                if (L >= 99.99) return [1,1,1];
                if (L <= 0.01) return [0,0,0];
                const bounds = getBounds(L);
                const hrad = H / 360 * Math.PI * 2;
                let min = Number.MAX_VALUE;
                for (let i = 0; i < bounds.length; i++) {
                    const l = bounds[i].b / (Math.sin(hrad) - bounds[i].m * Math.cos(hrad));
                    if (l > 0 && l < min) min = l;
                }
                const C = min / 100 * S;
                const U = C * Math.cos(hrad), V = C * Math.sin(hrad);
                const Y = L > 8 ? Math.pow((L + 16) / 116, 3) : L / 903.2962962;
                const uPrime = U / (13 * L) + 0.1978300066;
                const vPrime = V / (13 * L) + 0.4683199949;
                const X = (Y * 9 * uPrime) / (4 * vPrime);
                const Z = (Y * (12 - 3 * uPrime - 20 * vPrime)) / (4 * vPrime);
                const r = fromLinear(X * m[0][0] + Y * m[0][1] + Z * m[0][2]);
                const g = fromLinear(X * m[1][0] + Y * m[1][1] + Z * m[1][2]);
                const b = fromLinear(X * m[2][0] + Y * m[2][1] + Z * m[2][2]);
                return [Math.max(0, Math.min(1, r)), Math.max(0, Math.min(1, g)), Math.max(0, Math.min(1, b))];
            };
        })();

        // HSLuv implementation using the embedded math
        function getHsluv(t) {
            return HSLuvLib(t * 360, 100, 50);
        }

        // 4. Oklch to RGB (Approximation via matrices)
        function oklchToRgb(t) {
            let L = 0.70;
            let C = 0.18; // safe chroma
            let h_radians = t * 360 * Math.PI / 180;
            
            let a = C * Math.cos(h_radians);
            let b = C * Math.sin(h_radians);

            let l_ = L + 0.3963377774 * a + 0.2158037573 * b;
            let m_ = L - 0.1055613458 * a - 0.0638541728 * b;
            let s_ = L - 0.0894841775 * a - 1.2914855480 * b;

            let l = Math.pow(Math.max(0, l_), 3);
            let m = Math.pow(Math.max(0, m_), 3);
            let s = Math.pow(Math.max(0, s_), 3);

            let r_lin =  4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
            let g_lin = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
            let b_lin = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;

            // Simple sRGB Gamma correction
            const gamma = (v) => v > 0.0031308 ? 1.055 * Math.pow(v, 1/2.4) - 0.055 : 12.92 * v;
            
            return [gamma(r_lin), gamma(g_lin), gamma(b_lin)];
        }

        // 5. Simulated LCH (using standard D65 matrices, simplified for speed)
        function lchToRgb(t) {
             let h = t * 360;
             let l = 70, c = 60;
             let hr = h * Math.PI / 180;
             let a = Math.cos(hr) * c;
             let b_lab = Math.sin(hr) * c;
             
             let y = (l + 16) / 116;
             let x = a / 500 + y;
             let z = y - b_lab / 200;

             let x3 = x*x*x, y3 = y*y*y, z3 = z*z*z;
             x = (x3 > 0.008856 ? x3 : (x - 16/116) / 7.787) * 0.95047;
             y = (y3 > 0.008856 ? y3 : (y - 16/116) / 7.787) * 1.00000;
             z = (z3 > 0.008856 ? z3 : (z - 16/116) / 7.787) * 1.08883;

             let r_lin = x *  3.2406 + y * -1.5372 + z * -0.4986;
             let g_lin = x * -0.9689 + y *  1.8758 + z *  0.0415;
             let b_lin = x *  0.0557 + y * -0.2040 + z *  1.0570;

             const gamma = (v) => v > 0.0031308 ? 1.055 * Math.pow(v, 1/2.4) - 0.055 : 12.92 * v;
             return [gamma(r_lin), gamma(g_lin), gamma(b_lin)];
        }

        // Base spaces definition. This order is the viewer's default order.
        const initialSpaces = [
            { id: 'XYZ', name: 'CIE XYZ', year: 1931, fn: wavelengthToRgb },
            { id: 'sRGB', name: 'sRGB', year: 1996, fn: getSrgb },
            { id: 'UVW', name: 'CIE UVW', year: 1964, fn: uvwToRgb },
            { id: 'CIELUV', name: 'CIE LUV', year: 1976, fn: lchUvToRgb },
            { id: 'LCH', name: 'CIE LCH', year: 1976, fn: lchToRgb },
            { id: 'OKLCH', name: 'OkLCH', year: 2020, fn: oklchToRgb },
            { id: 'HSLuv', name: 'HSLuv', year: 2015, fn: getHsluv }
        ];

        let activeSpaces = [...initialSpaces];
        let sampleCacheKey = '';
        const sampleCache = new Map();

        function invalidateSampleCache() {
            sampleCacheKey = '';
            sampleCache.clear();
        }

        function applyModifiersRgb(rgb) {
            let [r, g, b] = rgb;

            // 1. Saturation
            if (state.sat !== 1.0) {
                let luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                r = luma + state.sat * (r - luma);
                g = luma + state.sat * (g - luma);
                b = luma + state.sat * (b - luma);
            }
            
            // 2. Tint (mix with White)
            if (state.tint > 0) {
                r = r + (1.0 - r) * state.tint;
                g = g + (1.0 - g) * state.tint;
                b = b + (1.0 - b) * state.tint;
            }

            // 3. Shade (mix with Black)
            if (state.shade > 0) {
                r = r * (1.0 - state.shade);
                g = g * (1.0 - state.shade);
                b = b * (1.0 - state.shade);
            }

            // 4. Tone (mix with Neutral Gray 0.5)
            if (state.tone > 0) {
                r = r + (0.5 - r) * state.tone;
                g = g + (0.5 - g) * state.tone;
                b = b + (0.5 - b) * state.tone;
            }

            // Clamp and Format
            r = Math.max(0, Math.min(1, r));
            g = Math.max(0, Math.min(1, g));
            b = Math.max(0, Math.min(1, b));

            let r8 = Math.round(r * 255);
            let g8 = Math.round(g * 255);
            let b8 = Math.round(b * 255);

            return [r8, g8, b8];
        }

        function rgbString(rgb) {
            return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
        }

        function rgbToHsl([r8, g8, b8]) {
            let r = r8 / 255, g = g8 / 255, b = b8 / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0, s = 0, l = (max + min) / 2;
            if (d) {
                s = d / (1 - Math.abs(2 * l - 1));
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    default: h = ((r - g) / d + 4) / 6;
                }
            }
            return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
        }

        function rgbToCmyk([r8, g8, b8]) {
            const r = r8 / 255, g = g8 / 255, b = b8 / 255;
            const k = 1 - Math.max(r, g, b);
            if (k >= 1) return [0, 0, 0, 100];
            return [
                Math.round((1 - r - k) / (1 - k) * 100),
                Math.round((1 - g - k) / (1 - k) * 100),
                Math.round((1 - b - k) / (1 - k) * 100),
                Math.round(k * 100)
            ];
        }

        function formatColor(rgb, format = state.format) {
            const hex = rgb.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
            if (format === 'hex') return hex;
            if (format === 'hashHex') return `#${hex}`;
            if (format === 'rgb') return rgbString(rgb);
            if (format === 'hsl') {
                const [h, s, l] = rgbToHsl(rgb);
                return `hsl(${h}, ${s}%, ${l}%)`;
            }
            const [c, m, y, k] = rgbToCmyk(rgb);
            return `cmyk(${c}%, ${m}%, ${y}%, ${k}%)`;
        }

        function sampleSpace(space) {
            const key = `${state.sat}|${state.tint}|${state.shade}|${state.tone}`;
            if (key !== sampleCacheKey) {
                sampleCacheKey = key;
                sampleCache.clear();
            }
            if (!sampleCache.has(space.id)) {
                sampleCache.set(space.id, Array.from({length: NUM_STOPS}, (_, i) => applyModifiersRgb(space.fn(i / NUM_STOPS))));
            }
            return sampleCache.get(space.id);
        }

        function hueOf(rgb) {
            const [h, s] = rgbToHsl(rgb);
            return {h, chroma: s};
        }

        function hueDistance(a, b) {
            const distance = Math.abs(a - b);
            return Math.min(distance, 360 - distance);
        }

        function getSelectionFor(space, t, targetRgb = null) {
            const samples = sampleSpace(space);
            if (state.selector !== 'closest' || !targetRgb) {
                const index = Math.min(NUM_STOPS - 1, Math.max(0, Math.round(t * (NUM_STOPS - 1))));
                return { index, rgb: samples[index] };
            }
            const targetHue = hueOf(targetRgb);
            let bestIndex = 0, bestScore = Infinity;
            samples.forEach((rgb, index) => {
                const candidate = hueOf(rgb);
                const score = targetHue.chroma < 3 || candidate.chroma < 3
                    ? Math.hypot(rgb[0] - targetRgb[0], rgb[1] - targetRgb[1], rgb[2] - targetRgb[2])
                    : hueDistance(candidate.h, targetHue.h);
                if (score < bestScore) { bestScore = score; bestIndex = index; }
            });
            return { index: bestIndex, rgb: samples[bestIndex] };
        }

        function renderSpectrums() {
            const wrapper = document.getElementById('spectrum-wrapper');
            // Adjust the width of the scrolling container based on zoom
            wrapper.style.width = `${state.zoom * 100}%`;
            
            let html = '';

            activeSpaces.forEach((space, index) => {
                // Generate gradient stops
                let stops = '';
                const samples = sampleSpace(space);
                for (let i = 0; i <= NUM_STOPS; i++) {
                    const sample = samples[i % NUM_STOPS];
                    let finalColor = rgbString(sample);
                    stops += `<stop offset="${(i / NUM_STOPS * 100).toFixed(2)}%" stop-color="${finalColor}" />`;
                }

                // Render row (no vertical space / borders between displays)
                html += `
                    <div class="spectrum-row flex flex-row h-16 w-full" data-index="${index}">
                        <!-- Left sticky label (Drag Handle) -->
                        <div class="space-label w-52 shrink-0 sticky left-0 z-10 bg-gray-900 flex items-center px-4 cursor-grab active:cursor-grabbing hover:bg-gray-800 transition-colors select-none"
                             draggable="true">
                            <div class="flex-1 font-semibold text-gray-200 tracking-wider flex flex-col md:flex-row md:items-baseline">
                                ${space.name}
                                <span class="text-xs text-gray-500 md:ml-2">(${space.year})</span>
                            </div>
                            <div class="text-gray-500 hover:text-white p-2 cursor-help z-20" onclick="showModal('${space.id}')" onmousedown="event.stopPropagation()" title="Click for info">ⓘ</div>
                        </div>
                        
                        <!-- SVG Spectrum -->
                        <div class="flex-1 min-w-0 relative spectrum-canvas cursor-crosshair" data-space-id="${space.id}">
                            <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none">
                                <defs>
                                    <linearGradient id="grad-${space.id}" x1="0%" y1="0%" x2="100%" y2="0%">
                                        ${stops}
                                    </linearGradient>
                                </defs>
                                <rect width="100%" height="100%" fill="url(#grad-${space.id})" />
                            </svg>
                        </div>
                    </div>
                `;
            });

            wrapper.innerHTML = html;
            fitRowHeights();
            renderSelectorOverlays();
        }

        function fitRowHeights() {
            const rows = document.querySelectorAll('.spectrum-row');
            const available = scrollContainer ? scrollContainer.clientHeight : 0;
            const height = available > rows.length * COMPACT_ROW_HEIGHT
                ? Math.floor(available / Math.max(1, rows.length))
                : COMPACT_ROW_HEIGHT;
            rows.forEach(row => row.style.height = `${height}px`);
        }

        function setButtonGroup(selector, activeValue, activeClass = 'bg-blue-600') {
            document.querySelectorAll(selector).forEach(button => {
                const active = button.dataset.format === activeValue || button.dataset.selector === activeValue;
                button.classList.toggle(activeClass, active);
                button.classList.toggle('bg-gray-700', !active);
            });
        }

        function renderSelectorOverlays(hover = null) {
            document.querySelectorAll('.selector-marker, .selector-tooltip, .selector-path').forEach(el => el.remove());
            if (!hover || state.selector === 'point') return;
            const rows = [...document.querySelectorAll('.spectrum-row')];
            const targetSpace = activeSpaces[hover.rowIndex];
            const target = getSelectionFor(targetSpace, hover.t, null);
            const targetRgb = target.rgb;
            const selections = rows.map((row, rowIndex) => {
                const canvas = row.querySelector('.spectrum-canvas');
                const selection = getSelectionFor(activeSpaces[rowIndex], hover.t, state.selector === 'closest' ? targetRgb : null);
                const x = (selection.index / (NUM_STOPS - 1)) * canvas.clientWidth;
                return { row, canvas, selection, x };
            });
            if (state.selector === 'vertical') {
                selections.forEach(({canvas, x, selection}) => addMarker(canvas, x, selection.rgb));
            } else {
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.className.baseVal = 'selector-path';
                svg.setAttribute('viewBox', `0 0 ${Math.max(1, wrapper.clientWidth)} ${Math.max(1, wrapper.clientHeight)}`);
                const points = selections.map(({row, x}) => `${x + row.querySelector('.space-label').offsetWidth},${row.offsetTop + row.offsetHeight / 2}`).join(' ');
                const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
                polyline.setAttribute('points', points);
                polyline.setAttribute('fill', 'none');
                polyline.setAttribute('stroke', 'white');
                polyline.setAttribute('stroke-width', '3');
                polyline.setAttribute('stroke-dasharray', '5 3');
                svg.appendChild(polyline);
                wrapper.appendChild(svg);
                selections.forEach(({canvas, x, selection}) => addMarker(canvas, x, selection.rgb));
            }
            state.hoverSelections = selections;
        }

        function addMarker(canvas, x, rgb) {
            const marker = document.createElement('div');
            marker.className = 'selector-marker';
            marker.style.left = `${x}px`;
            canvas.appendChild(marker);
            const label = document.createElement('div');
            label.className = 'selector-tooltip';
            label.style.left = `${x}px`;
            label.style.backgroundColor = rgbString(rgb);
            const [r, g, b] = rgb;
            label.style.color = (0.2126 * r + 0.7152 * g + 0.0722 * b) > 128 ? '#000' : '#fff';
            label.textContent = formatColor(rgb);
            label._rgb = rgb;
            canvas.appendChild(label);
        }

        function updateSelectedValues(selections) {
            state.selectedValues = selections.map(({space, rgb}) => ({space, rgb}));
            document.getElementById('selected-color').value = state.selectedValues.map(item => formatColor(item.rgb)).join('\n');
        }

        function updateSort() {
            if (state.order === 'default') {
                activeSpaces = [...initialSpaces];
            } else if (state.order === 'alpha') {
                activeSpaces = [...initialSpaces].sort((a, b) => a.name.localeCompare(b.name));
            } else if (state.order === 'date') {
                activeSpaces = [...initialSpaces].sort((a, b) => a.year - b.year);
            }
            // If custom, we leave activeSpaces as is (it remembers its order)
            
            if (state.inverse && state.order !== 'custom') {
                activeSpaces.reverse();
            }
            renderSpectrums();
        }

        // Attach event listeners for Sliders
        const controls = ['sat', 'tint', 'shade', 'tone', 'zoom'];
        controls.forEach(id => {
            const input = document.getElementById(`ctrl-${id}`);
            const valDisplay = document.getElementById(`val-${id}`);
            input.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                state[id] = val;
                invalidateSampleCache();
                valDisplay.textContent = id === 'zoom' ? val.toFixed(1) + 'x' : val.toFixed(2);
                renderSpectrums();
            });
        });

        // Dropdown Event
        document.getElementById('ctrl-order').addEventListener('change', (e) => {
            state.order = e.target.value;
            updateSort();
        });

        // Inverse Button Event
        document.getElementById('ctrl-inverse').addEventListener('click', (e) => {
            state.inverse = !state.inverse;
            if (state.order === 'custom') {
                activeSpaces.reverse();
                renderSpectrums();
            } else {
                e.currentTarget.classList.toggle('bg-blue-600');
                e.currentTarget.classList.toggle('bg-gray-700');
                updateSort();
            }
        });

        // Reset Zoom Event
        document.getElementById('btn-reset-zoom').addEventListener('click', () => {
            state.zoom = 1.0;
            document.getElementById('ctrl-zoom').value = state.zoom;
            document.getElementById('val-zoom').textContent = state.zoom.toFixed(1) + 'x';
            renderSpectrums();
            scrollContainer.scrollLeft = 0;
        });

        // Reset All Settings Event
        document.getElementById('btn-reset-all').addEventListener('click', () => {
            // Reset state
            state.sat = 1.0;
            state.tint = 0.0;
            state.shade = 0.0;
            state.tone = 0.0;
            state.zoom = 1.0;
            state.order = 'default';
            state.inverse = false;
            state.format = 'hex';
            state.selector = 'point';
            state.selectedValues = [];
            document.getElementById('selected-color').value = '';
            setButtonGroup('.format-button', state.format);
            setButtonGroup('.selector-button', state.selector);
            invalidateSampleCache();
            
            // Update UI sliders and readouts
            controls.forEach(id => {
                const val = state[id];
                document.getElementById(`ctrl-${id}`).value = val;
                document.getElementById(`val-${id}`).textContent = id === 'zoom' ? val.toFixed(1) + 'x' : val.toFixed(2);
            });
            
            // Update Order Dropdown and Inverse Button
            document.getElementById('ctrl-order').value = 'default';
            document.getElementById('ctrl-inverse').classList.remove('bg-blue-600');
            document.getElementById('ctrl-inverse').classList.add('bg-gray-700');
            
            // Reset Pan and re-render
            updateSort();
            scrollContainer.scrollLeft = 0;
        });

        const wrapper = document.getElementById('spectrum-wrapper');
        const scrollContainer = wrapper.parentElement;

        // Interactive States
        let isPanning = false;
        let startX;
        let scrollLeftPos;
        const tooltip = document.getElementById('color-tooltip');

        window.addEventListener('resize', fitRowHeights);

        document.querySelectorAll('.format-button').forEach(button => button.addEventListener('click', () => {
            state.format = button.dataset.format;
            setButtonGroup('.format-button', state.format);
            document.querySelectorAll('.selector-tooltip').forEach(label => {
                const marker = label.previousElementSibling;
                if (marker) label.textContent = formatColor(label._rgb || [0, 0, 0]);
            });
            document.getElementById('selected-color').value = state.selectedValues.map(item => formatColor(item.rgb)).join('\n');
            renderSelectorOverlays(state.lastHover);
        }));

        document.querySelectorAll('.selector-button').forEach(button => button.addEventListener('click', () => {
            state.selector = button.dataset.selector;
            setButtonGroup('.selector-button', state.selector);
            renderSelectorOverlays(state.lastHover);
        }));

        document.getElementById('copy-color').addEventListener('click', async () => {
            const field = document.getElementById('selected-color');
            if (!field.value) return;
            try {
                await navigator.clipboard.writeText(field.value);
                document.getElementById('selection-status').textContent = 'Copied';
                setTimeout(() => document.getElementById('selection-status').textContent = '', 1200);
            } catch (error) {
                field.select();
                document.getElementById('selection-status').textContent = 'Select and copy manually';
            }
        });

        // Panning and Tooltip Mouse Events
        wrapper.addEventListener('mousedown', (e) => {
            const canvas = e.target.closest('.spectrum-canvas');
            if (canvas) {
                isPanning = true;
                wrapper.classList.add('grabbing');
                startX = e.pageX - scrollContainer.offsetLeft;
                scrollLeftPos = scrollContainer.scrollLeft;
            }
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
            wrapper.classList.remove('grabbing');
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                e.preventDefault();
                const x = e.pageX - scrollContainer.offsetLeft;
                const walk = (x - startX) * 1.5; // Panning speed multiplier
                scrollContainer.scrollLeft = scrollLeftPos - walk;
            }
            
            // Tooltip processing
            const canvas = e.target.closest('.spectrum-canvas');
            if (canvas && !isPanning) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const width = rect.width;
                const t = Math.max(0, Math.min(1, x / width));
                
                const row = canvas.closest('.spectrum-row');
                const spaceIndex = parseInt(row.dataset.index);
                const space = activeSpaces[spaceIndex];
                
                const rgb = applyModifiersRgb(space.fn(t));
                const colorStr = formatColor(rgb);
                
                tooltip.textContent = colorStr;
                tooltip.style.backgroundColor = rgbString(rgb);
                
                // Text color contrast check
                const [r, g, b] = rgb;
                const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                tooltip.style.color = luma > 128 ? '#000' : '#fff';
                
                tooltip.style.left = e.clientX + 'px';
                tooltip.style.top = e.clientY + 'px';
                tooltip.classList.remove('hidden');
                state.lastHover = {t, rowIndex: spaceIndex};
                if (state.selector !== 'point') {
                    renderSelectorOverlays(state.lastHover);
                    const target = getSelectionFor(activeSpaces[spaceIndex], t, null);
                    const selections = activeSpaces.map((space, rowIndex) => {
                        const selected = getSelectionFor(space, t, state.selector === 'closest' ? target.rgb : null);
                        return {space, rgb: selected.rgb, rowIndex};
                    });
                    updateSelectedValues(selections);
                }
            } else {
                tooltip.classList.add('hidden');
            }
        });

        wrapper.addEventListener('click', (e) => {
            const canvas = e.target.closest('.spectrum-canvas');
            if (!canvas) return;
            const rect = canvas.getBoundingClientRect();
            const t = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const row = canvas.closest('.spectrum-row');
            const rowIndex = parseInt(row.dataset.index);
            const target = getSelectionFor(activeSpaces[rowIndex], t, null);
            const selections = state.selector === 'point'
                ? [{space: activeSpaces[rowIndex], rgb: target.rgb, rowIndex}]
                : activeSpaces.map((space, index) => {
                    const selected = getSelectionFor(space, t, state.selector === 'closest' ? target.rgb : null);
                    return {space, rgb: selected.rgb, rowIndex: index};
                });
            state.selectedRgb = target.rgb;
            updateSelectedValues(selections);
        });

        wrapper.addEventListener('mouseleave', () => {
            tooltip.classList.add('hidden');
        });

        function zoomAtPointer(e, newZoom) {
            const rect = scrollContainer.getBoundingClientRect();
            const canvas = e.target.closest('.spectrum-canvas');
            if (!canvas) return;
            const canvasRect = canvas.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (e.clientX - canvasRect.left) / canvasRect.width));
            const canvasStart = canvasRect.left - rect.left + scrollContainer.scrollLeft;
            const pointerViewportX = e.clientX - rect.left;
            state.zoom = newZoom;
            document.getElementById('ctrl-zoom').value = state.zoom;
            document.getElementById('val-zoom').textContent = state.zoom.toFixed(1) + 'x';
            renderSpectrums();
            const newCanvasWidth = document.querySelector('.spectrum-canvas').clientWidth;
            const targetScroll = canvasStart + ratio * newCanvasWidth - pointerViewportX;
            scrollContainer.scrollLeft = Math.max(0, targetScroll);
            requestAnimationFrame(() => scrollContainer.scrollLeft = Math.max(0, targetScroll));
        }

        // Zoom Control via Mouse Wheel (Pinch) and Double Click
        scrollContainer.addEventListener('wheel', (e) => {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                
                let zoomChange = e.deltaY * -0.01;
                const newZoom = Math.max(1, Math.min(10, state.zoom + zoomChange));
                
                if (newZoom === state.zoom) return;
                zoomAtPointer(e, newZoom);
            }
        }, { passive: false });

        scrollContainer.addEventListener('dblclick', (e) => {
            if (e.target.closest('.spectrum-canvas')) {
                const newZoom = state.zoom >= 10 ? 1 : Math.min(10, state.zoom + 2);
                if (newZoom === state.zoom) return;
                zoomAtPointer(e, newZoom);
            }
        });

        // Drag & Drop Reordering
        wrapper.addEventListener('dragstart', (e) => {
            const label = e.target.closest('.space-label');
            if (!label) {
                e.preventDefault();
                return;
            }
            
            // Auto switch to custom sort when dragging names
            if (state.order !== 'custom') {
                state.order = 'custom';
                document.getElementById('ctrl-order').value = 'custom';
            }

            const row = label.closest('.spectrum-row');
            state.draggedItemIndex = parseInt(row.dataset.index);
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => row.classList.add('opacity-50'), 0);
        });

        wrapper.addEventListener('dragend', (e) => {
            const row = e.target.closest('.spectrum-row');
            if (row) row.classList.remove('opacity-50');
            document.querySelectorAll('.spectrum-row').forEach(el => el.classList.remove('drag-over'));
        });

        wrapper.addEventListener('dragover', (e) => {
            if (state.order !== 'custom') return;
            e.preventDefault(); 
            const row = e.target.closest('.spectrum-row');
            if (row && parseInt(row.dataset.index) !== state.draggedItemIndex) {
                row.classList.add('drag-over');
            }
        });

        wrapper.addEventListener('dragleave', (e) => {
            if (state.order !== 'custom') return;
            const row = e.target.closest('.spectrum-row');
            if (row) row.classList.remove('drag-over');
        });

        wrapper.addEventListener('drop', (e) => {
            if (state.order !== 'custom') return;
            e.preventDefault();
            const row = e.target.closest('.spectrum-row');
            if (!row) return;
            
            const targetIndex = parseInt(row.dataset.index);
            if (targetIndex !== state.draggedItemIndex && state.draggedItemIndex !== null) {
                const item = activeSpaces.splice(state.draggedItemIndex, 1)[0];
                activeSpaces.splice(targetIndex, 0, item);
                renderSpectrums();
            }
        });

        const modal = document.getElementById('info-modal');
        const modalContent = document.getElementById('modal-content-box');
        let modalSpace = null;

        function exportFilename(space, extension) {
            const safeName = space.name.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
            return `${safeName}_sat-${state.sat.toFixed(2)}_tint-${state.tint.toFixed(2)}_shade-${state.shade.toFixed(2)}_tone-${state.tone.toFixed(2)}.${extension}`;
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }

        function saveSpace(space, format) {
            const samples = sampleSpace(space);
            const filename = exportFilename(space, format);
            if (format === 'json') {
                const payload = {
                    name: space.name,
                    sat: state.sat,
                    tint: state.tint,
                    shade: state.shade,
                    tone: state.tone,
                    colors: samples.map(rgb => formatColor(rgb))
                };
                downloadBlob(new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'}), filename);
                return;
            }
            if (format === 'svg') {
                const stops = samples.map((rgb, i) => `<stop offset="${(i / (NUM_STOPS - 1) * 100).toFixed(3)}%" stop-color="${rgbString(rgb)}"/>`).join('');
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${NUM_STOPS}" height="80" viewBox="0 0 ${NUM_STOPS} 80"><defs><linearGradient id="s" x1="0" x2="1" y1="0" y2="0">${stops}</linearGradient></defs><rect width="100%" height="100%" fill="url(#s)"/></svg>`;
                downloadBlob(new Blob([svg], {type: 'image/svg+xml'}), filename);
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = NUM_STOPS;
            canvas.height = 80;
            const context = canvas.getContext('2d');
            samples.forEach((rgb, i) => {
                context.fillStyle = rgbString(rgb);
                context.fillRect(i, 0, 1, canvas.height);
            });
            canvas.toBlob(blob => {
                if (blob) downloadBlob(blob, filename);
            }, 'image/png');
        }
        
        function showModal(spaceId) {
            const space = initialSpaces.find(s => s.id === spaceId);
            if (!space) return;
            modalSpace = space;

            document.getElementById('modal-title').textContent = space.name;
            document.getElementById('modal-body').innerHTML = spaceInfo[spaceId] || "Information not available.";
            
            modal.classList.remove('hidden');
            // Trigger reflow to apply transition
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
        }

        function hideModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        document.getElementById('modal-close').addEventListener('click', hideModal);
        document.getElementById('modal-save').addEventListener('click', () => {
            if (modalSpace) saveSpace(modalSpace, document.getElementById('save-format').value);
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) hideModal();
        });

        // Initialize App
        renderSpectrums();

    </script>
</body>
</html>
